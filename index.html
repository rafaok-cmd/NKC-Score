  s1.forEach(([s,v],i)=>{const x=bx+i*44;LB(x+13,yBot+60,s,{a:'middle'});box(x,yBot+66,26,v);if(i<5) LB(x+35,yBot+80,'+',{a:'middle',size:10});});
  LB(bx+6*44-9,yBot+80,'=',{a:'middle',size:10});LB(bx+6*44+18,yBot+60,'SUM',{a:'middle'});box(bx+6*44,yBot+66,38,s1.reduce((a,[,v])=>a+v,0));
  const s2=[['R',R_,'+'],['LOB',LOB,'+'],['PO',PO,'−'],['TIE',0,'=']];
  s2.forEach(([s,v,op],i)=>{const x=bx+i*66;LB(x+19,yBot+96,s,{a:'middle'});box(x,yBot+101,38,v);LB(x+52,yBot+115,op,{a:'middle',size:10});});
  LB(bx+6*44+18,yBot+96,'SUM',{a:'middle'});box(bx+6*44,yBot+101,38,R_+LOB+PO);
  /* rodapé */
  out.push(`<text x="${xR}" y="${yEnd+16}" font-size="8" font-family="${WC.font}" fill="#6b7c8c" text-anchor="end">Gerado pelo NKC Score v2 · ${esc(gMyTeam(g).name)} ${S.total.my} x ${S.total.opp} ${esc(g.oppName)} · ${esc(fmtDate(g.date))}${g.final?'':' · jogo em andamento'}</text>`);
  out.push(`<text x="${x0}" y="${yEnd+16}" font-size="8" font-family="${WC.font}" fill="#6b7c8c">Quadrantes: 1ª base (inf. dir.), 2ª (sup. dir.), 3ª (sup. esq.), home (inf. esq.) · nº = ordem do rebatedor que avançou o corredor · ● corrida limpa (ER) · ○ corrida não limpa · (n) out · traço = fim da meia entrada</text>`);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#fff"/>${out.join('')}</svg>`;
}
function wbscPages(g){const M=wbscModel(g);const away=g.home?'opp':'my',home=g.home?'my':'opp';return [wbscSvg(M,home,true),wbscSvg(M,away,false)];}

/* ---------- PDF offline (JPEG em A4 paisagem, sem bibliotecas) ---------- */
async function svgJpeg(svg,scale){
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  await (img.decode?img.decode():new Promise((r,j)=>{img.onload=r;img.onerror=j;}));
  const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
  cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.9));
  return {bytes:new Uint8Array(await blob.arrayBuffer()),w,h};
}
function pdfBytes(pages){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;};
  push('%PDF-1.4\n%NKC\n');
  const n=pages.length,kids=pages.map((_,i)=>(3+i*3)+' 0 R').join(' ');
  offs[1]=len;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2]=len;push(`2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${n} >>\nendobj\n`);
  pages.forEach((p,i)=>{
    const po=3+i*3,io=po+1,co=po+2,PW=842,PH=595,m=14;
    const s=Math.min((PW-2*m)/p.w,(PH-2*m)/p.h),dw=p.w*s,dh=p.h*s,dx=(PW-dw)/2,dy=(PH-dh)/2;
    const content=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${dx.toFixed(2)} ${dy.toFixed(2)} cm /Im0 Do Q`;
    offs[po]=len;push(`${po} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${io} 0 R >> >> /Contents ${co} 0 R >>\nendobj\n`);
    offs[io]=len;push(`${io} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`);push(p.bytes);push('\nendstream\nendobj\n');
    offs[co]=len;push(`${co} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  });
  const total=3+n*3,xref=len;
  let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++) x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${total} /Root 1 0 R /Info << /Title (Sumula WBSC - NKC Score) /Producer (NKC Score v2) >> >>\nstartxref\n${xref}\n%%EOF\n`);
  const out=new Uint8Array(len);let o=0;for(const b of parts){out.set(b,o);o+=b.length;}return out;
}
async function wbscPdf(g){
  const svgs=wbscPages(g);const pages=[];
  for(const s of svgs) pages.push(await svgJpeg(s,2.2));
  return {blob:new Blob([pdfBytes(pages)],{type:'application/pdf'}),name:`nkcscore_sumula-wbsc_${g.date}_${slug(g.oppName)}.pdf`};
}
function wbscPrint(g){
  const svgs=wbscPages(g);
  const fr=document.createElement('iframe');fr.style.cssText='position:fixed;width:0;height:0;border:0;right:0;bottom:0';document.body.appendChild(fr);
  const d=fr.contentDocument;d.open();
  d.write(`<!doctype html><html><head><meta charset="utf-8"><title>Súmula WBSC</title><style>@page{size:A4 landscape;margin:6mm}html,body{margin:0}svg{display:block;width:100%;height:auto;page-break-after:always;break-after:page}svg:last-child{page-break-after:auto;break-after:auto}</style></head><body>${svgs.join('')}</body></html>`);
  d.close();
  setTimeout(()=>{try{fr.contentWindow.focus();fr.contentWindow.print();}catch(e){toast('Impressão indisponível aqui. Use o PDF.');}setTimeout(()=>fr.remove(),60000);},300);
}
const WB_FIELDS=[['tour','Torneio / campeonato'],['game','Jogo nº'],['city','Cidade'],['field','Campo'],['start','Início (hh:mm)'],['end','Fim (hh:mm)'],['time','Duração'],['ump','Árbitros'],['scorers','Anotadores (scorers)'],['tc','Comissário técnico (T.C.)'],['att','Público'],['weather','Clima / temperatura'],['notes','Observações']];
function wbscField(el){const g=gameById(el.dataset.g);if(!g) return;g.wbsc=g.wbsc||{};g.wbsc[el.dataset.k]=el.value.trim();saveDB();wbscPreview(g);}
function wbscPreview(g){const box=$('#wb-prev');if(!box) return;const s=wbscPages(g);box.innerHTML=s.map((x,i)=>`<figure class="wb-pg"><figcaption>${i?'Página 2 · VISITOR':'Página 1 · HOME'} · ${esc(i?(g.home?g.oppName:gMyTeam(g).name):(g.home?gMyTeam(g).name:g.oppName))}</figcaption><img alt="Súmula WBSC página ${i+1}" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(x)}"></figure>`).join('');}
function wbscSheet(id){
  const g=gameById(id);if(!g) return {title:'Súmula WBSC',body:'<p>Jogo não encontrado.</p>',foot:''};
  const m=g.wbsc||{};
  const val=k=>k==='field'&&m.field==null?(g.place||''):(m[k]||'');
  const canFile=!!(navigator.canShare&&window.File);
  const b=`${g.final?'':'<div class="warn" style="margin-bottom:10px">O jogo ainda não foi encerrado: a súmula mostra o que foi marcado até agora.</div>'}
    <p class="small muted" style="margin:0 0 10px">Folha oficial de anotação WBSC preenchida a partir das jogadas marcadas: página 1 = mandante (HOME, com placar por entrada), página 2 = visitante (VISITOR). Gera PDF A4 paisagem, sem internet.</p>
    <div class="row" style="flex-wrap:wrap">
      ${canFile?`<button class="btn wa" data-a="wbsc-share" data-id="${g.id}">Enviar PDF (WhatsApp)</button>`:''}
      <button class="btn primary" data-a="wbsc-dl" data-id="${g.id}">Baixar PDF</button>
      <button class="btn" data-a="wbsc-print" data-id="${g.id}">Imprimir</button>
    </div>
    <div class="wb-prev" id="wb-prev"></div>
    <details class="pdet" style="margin-top:10px"><summary>Dados do cabeçalho da súmula <span class="muted small">opcional</span></summary>
      <div class="stack" style="padding-bottom:12px">${WB_FIELDS.map(([k,l])=>`<label class="f">${l}<input data-g="${g.id}" data-k="${k}" value="${esc(val(k))}" onchange="wbscField(this)"></label>`).join('')}</div></details>
    <details class="pdet" style="margin-top:8px"><summary>Como ler a súmula</summary><div class="small" style="padding-bottom:12px">
      <p style="margin-top:0">Cada célula é um diamante: quadrante inferior direito = 1ª base, superior direito = 2ª, superior esquerdo = 3ª, inferior esquerdo = home. Rebatidas válidas: 1, 2 ou 3 traços + local da bola (7, 8, 9…); HR + local. Eliminações: 63, 6U, F8, L6, P4, KS (girando), KL (olhando), SF, SH; número do out no círculo central. BB, IBB, HP, E6, FC6. Avanço de corredor: número de ordem do rebatedor que o avançou, ou SB, WP, PB, BK, e6 (erro), CS, PO.</p>
      <p>Corrida: círculo cheio = limpa (ER), vazio = não limpa. A classificação ER é calculada automaticamente pela reconstrução da entrada sem erros e passed balls; confira antes de homologar. W/L/S e T (braço) ficam para o anotador preencher. O app não registra a posição em campo do adversário, então PO/A/E/DP dele aparecem só nos totais.</p></div></details>`;
  setTimeout(()=>wbscPreview(g),0);
  return {title:'Súmula oficial WBSC',body:b,foot:''};
}
async function wbscRun(id,mode){
  const g=gameById(id);if(!g) return;
  toast('Gerando PDF da súmula…');
  try{
    const f=await wbscPdf(g);
    if(mode==='share') await share(f); else {download(f);toast('PDF da súmula baixado');}
  }catch(e){toast('Não foi possível gerar o PDF neste navegador. Use Imprimir.');}
}

  else if(UI.tab==='pitcher') h=vPitcher();
  else if(UI.tab==='elenco') h=vRoster();
