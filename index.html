<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>NKC Score</title>
<meta name="application-name" content="NKC Score">
<meta name="version" content="2 (Nov/2026)">
<meta name="author" content="R. T. O.">
<meta name="description" content="NKC Score v2: súmula oficial WBSC, de beisebol offline, estatísticas, Pitcher Data, exportação para Excel e envio por WhatsApp.">
<meta name="theme-color" content="#394156">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NKC Score">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: coluna única para celular; faixa de placar de estádio no topo, campo verde como acento, tinta de súmula abaixo */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#E1E8E1; --ink:#121C16; --muted:#55655B; --line:#C8D2C9;
  --accent:#1C6943; --accent-ink:#FFFFFF; --accent-soft:#D3E7D9;
  --ball:#1C6943; --strike:#B4771C; --out:#B5382D; --danger:#B5382D;
  --field:#CFE2D2; --dirt:#E2CCB4; --chalk:#FFFFFF;
  --zin:#DCEFE2; --zin-b:#2E9E5B; --zout:#FBE3E0; --zout-b:#C8473C; --zout-ink:#A1352C; --st:#2E9E5B; --bl:#D0443A;
  --board:#0B1310; --board-2:#16231C; --board-ink:#EEF3EC; --board-muted:#8FA397; --led:#F2B544; --led-b:#43B97E; --led-o:#E5574B;
  --shadow:rgba(8,16,12,.28);
  --f-display:"Roboto Condensed","Arial Narrow","Helvetica Neue",sans-serif-condensed,system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"Roboto Mono","SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1310; --surface:#151F1A; --surface-2:#1E2A24; --ink:#E4ECE6; --muted:#93A399; --line:#2B3932;
  --accent:#4DBA85; --accent-ink:#06120C; --accent-soft:#183326;
  --ball:#4DBA85; --strike:#E0A447; --out:#EC6A5E; --danger:#EC6A5E;
  --field:#1B3124; --dirt:#4A3A2B; --chalk:#D9E3DB; --shadow:rgba(0,0,0,.55);
  --zin:#173A27; --zin-b:#3FB574; --zout:#3A1D1A; --zout-b:#E0675C; --zout-ink:#F09A90; --st:#2FA862; --bl:#D9483E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1310; --surface:#151F1A; --surface-2:#1E2A24; --ink:#E4ECE6; --muted:#93A399; --line:#2B3932;
  --accent:#4DBA85; --accent-ink:#06120C; --accent-soft:#183326;
  --ball:#4DBA85; --strike:#E0A447; --out:#EC6A5E; --danger:#EC6A5E;
  --field:#1B3124; --dirt:#4A3A2B; --chalk:#D9E3DB; --shadow:rgba(0,0,0,.55);
  --zin:#173A27; --zin-b:#3FB574; --zout:#3A1D1A; --zout-b:#E0675C; --zout-ink:#F09A90; --st:#2FA862; --bl:#D9483E;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
[hidden]{display:none!important}
img,svg{max-width:100%}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(92px + env(safe-area-inset-bottom,0px))}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 12px}
.brand{font:700 15px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.brand svg{width:22px;height:22px;color:var(--accent)}
.pill{font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--accent-soft);color:var(--accent)}
h2{font:700 24px/1.15 var(--f-display);letter-spacing:.02em;margin:2px 0 10px;text-wrap:balance}
h3{font:700 12px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
p{margin:0 0 10px;max-width:65ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* placar */
.board{background:var(--board);border:1px solid var(--board-2);color:var(--board-ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--board-muted)}
.board-head span:last-child{white-space:nowrap}
.board-head span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-main{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center}
.teams{display:flex;flex-direction:column;gap:5px}
.team{display:flex;align-items:center;gap:10px;font:700 24px/1 var(--f-display);letter-spacing:.05em}
.team .ab{min-width:3.2ch}
.team .r{font-family:var(--f-mono);color:var(--led);font-weight:700}
.team i{width:7px;height:7px;border-radius:50%;background:transparent;flex:none}
.team.bat i{background:var(--led)}
.inning{font:700 34px/1 var(--f-display);text-align:center;color:var(--board-ink)}
.inning small{display:block;font:600 10px/1.4 var(--f-body);color:var(--board-muted);letter-spacing:.1em;text-transform:uppercase}
.count{display:flex;flex-direction:column;gap:6px;font:700 12px/1 var(--f-mono);color:var(--board-muted)}
.count span{display:flex;align-items:center;gap:5px}
.count b{width:12px}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--board-muted);display:inline-block}
.dot.b.on{background:var(--led-b);border-color:var(--led-b)}
.dot.s.on{background:var(--led);border-color:var(--led)}
.dot.o.on{background:var(--led-o);border-color:var(--led-o)}
.ls{overflow-x:auto;border-top:1px solid var(--board-2);padding-top:6px}
.ls table{border-collapse:collapse;font:500 12px/1 var(--f-mono);color:var(--board-muted);width:100%}
.ls th,.ls td{padding:4px 4px;text-align:center;min-width:20px;font-weight:500}
.ls th{font-size:10px}
.ls td:first-child,.ls th:first-child{text-align:left;color:var(--board-ink);font-family:var(--f-display);letter-spacing:.05em}
.ls .cur{color:var(--led)}
.ls .tot{color:var(--board-ink);font-weight:700}
.ls .sep{border-left:1px solid var(--board-2)}

/* duelo */
.matchup{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:12px;align-items:center}
.who{display:flex;flex-direction:column;gap:3px;min-width:0}
.lbl{font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.who .nm{font:700 21px/1.1 var(--f-display);overflow-wrap:anywhere}
.who .sub{font-size:13px;color:var(--muted)}
.who hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.diamond{width:100%;height:auto;display:block}
.diamond g[data-a]{cursor:pointer}

/* botões */
button{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;cursor:pointer;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.pbtn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible,.zone button:focus-visible,.list-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:active,.pbtn:active,.chip:active{transform:translateY(1px)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pbtn{border:1px solid var(--line);border-radius:12px;min-height:66px;font:700 16px/1.1 var(--f-display);letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--surface);color:var(--ink);padding:6px}
.pbtn small{font:600 11px/1 var(--f-mono);color:var(--muted)}
.pbtn.ball{box-shadow:inset 0 -4px 0 var(--ball)}
.pbtn.strike{box-shadow:inset 0 -4px 0 var(--strike)}
.pbtn.play{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pbtn.play small{color:inherit;opacity:.8}
.pbtn[disabled]{opacity:.4}
.pad2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad2 .btn{padding:8px 4px;font-size:13px}

details.pdet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
details.pdet summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.pdet summary::after{content:"+";color:var(--muted);font-family:var(--f-mono)}
details.pdet[open] summary::after{content:"−"}
details.pdet .in{padding-bottom:12px;display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:start}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font-weight:600;font-size:14px;min-height:38px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.out.on{background:var(--danger);border-color:var(--danger);color:#fff}
.chip.sm{padding:5px 10px;min-height:34px;font-size:13px}

.zone{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:100%;max-width:220px;aspect-ratio:1/1.15;margin:0 auto}
.zone button{border:1px dashed var(--line);background:transparent;border-radius:4px;min-height:0;cursor:pointer;padding:0;font:600 11px var(--f-mono);color:var(--muted)}
.zone button.in{border:1px solid var(--muted);background:var(--surface-2)}
.zone button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.zone-cap{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}

.log{display:flex;flex-direction:column}
.log-item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink)}
.log-item .nt{font:700 14px/1.2 var(--f-mono);overflow-wrap:anywhere}
.log-item .ds{min-width:0;font-size:14px}
.log-item .ds small{display:block;color:var(--muted);font-size:12px}
.log-item .rs{font:700 12px var(--f-mono);color:var(--accent);white-space:nowrap}
.log-item .nb{display:block;font-size:12px;color:var(--strike);margin-top:2px}
.inn-h{font:700 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px}
button.log-item{cursor:pointer}

.fl-display{font:700 22px/1 var(--f-mono);padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:46px;display:flex;align-items:center}
.fl-display.empty{font:400 14px var(--f-body);color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.keys button{min-height:46px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:700 16px/1 var(--f-mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.keys button small{font:600 10px var(--f-body);color:var(--muted)}

.mv-row{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.mv-row .who2{font-size:14px;font-weight:600}
.mv-row .who2 span{color:var(--muted);font-weight:500}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;width:44px;height:42px;font:700 18px var(--f-mono);cursor:pointer;color:var(--ink)}
.stepper output{min-width:34px;text-align:center;font:700 16px var(--f-mono)}

.field{width:100%;height:auto;display:block;max-width:420px;margin:0 auto;touch-action:manipulation}
.field.pick{cursor:crosshair}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);justify-content:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* folha inferior */
.backdrop{position:fixed;inset:0;background:var(--shadow);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:16px 16px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;box-shadow:0 -10px 34px var(--shadow);max-width:640px;margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:14px;padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head h2{margin:0;font-size:20px}
.sheet-body{overflow:auto;padding-top:2px;padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overscroll-behavior:contain}
.sheet-foot{display:flex;gap:8px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .btn{flex:1}
.sheet-err{color:var(--danger);font-weight:600;font-size:14px;margin-top:10px}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--ink)}

/* navegação */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px/1 var(--f-body);color:var(--muted);min-height:54px;cursor:pointer}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* tabelas */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font:700 11px/1 var(--f-body);letter-spacing:.05em;color:var(--muted);text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--f-mono);font-size:13px}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-family:var(--f-body)}
.tbl tr.tot td{font-weight:700;background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.foot-note{font-size:12px;color:var(--muted);margin-top:6px}

/* formulários */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;flex:1 1 140px;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:9px 14px;font-weight:600;min-height:42px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg.nowrap{flex-wrap:nowrap}
.seg.nowrap button{white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.lu-row{display:grid;grid-template-columns:26px minmax(0,1fr) 86px;gap:6px;align-items:center;margin-bottom:6px}
.lu-row.opp{grid-template-columns:26px 72px minmax(0,1fr)}
.lu-row .n{font:700 14px var(--f-mono);color:var(--muted);text-align:right}

.list-btn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;color:var(--ink)}
.list-btn.game{grid-template-columns:auto minmax(0,1fr) auto}
.crest{width:30px;height:30px;border-radius:7px;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden;border:1px solid var(--line)}
.board .crest{border-color:var(--board-2)}
.crest img{width:100%;height:100%;object-fit:contain;padding:2px;display:block}
.crest b{font:700 15px/1 var(--f-display);color:#18221D}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
.vs-side{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.vs-side label.f{flex:none;width:100%}
.stack>label.f,.card>label.f,.sheet-body>label.f{flex:none}
.vs-x{font:700 20px/1 var(--f-display);color:var(--muted);padding-bottom:12px}
.team-head{display:flex;gap:12px;align-items:flex-start}
@media (max-width:420px){.vs{grid-template-columns:1fr}.vs-x{display:none}}
.list-btn .t{font:700 17px/1.2 var(--f-display);letter-spacing:.02em}
.list-btn .s{font-size:13px;color:var(--muted)}
.list-btn .sc{font:700 20px/1 var(--f-mono);text-align:right}
.res{font:700 11px var(--f-body);letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.res.v{background:var(--accent-soft);color:var(--accent)}
.res.d{color:var(--out)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px var(--shadow);font-size:14px}
.note{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.warn{border:1px solid var(--strike);border-radius:var(--r);padding:10px 12px;font-size:13px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent)}
.bar .v{font-family:var(--f-mono);text-align:right;font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:260px;margin:0 auto;aspect-ratio:1/1.15}
.heat div{border-radius:4px;display:flex;align-items:center;justify-content:center;font:700 12px var(--f-mono);border:1px dashed var(--line)}
.heat div.in{border:1px solid var(--muted)}
@media (max-width:380px){.matchup{grid-template-columns:minmax(0,1fr) 108px}.pbtn{font-size:15px}.team{font-size:21px}.inning{font-size:28px}}
.tabs button{font-size:10.5px}

/* início e módulos */
button.brand{border:0;background:none;color:inherit;padding:4px 0;cursor:pointer}

#painel-wrap{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

<style>
/* Layout: scouting dashboard — sticky filter rail, KPI band by discipline, field + readout, drill-down tables */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#18221D; --muted:#5B6862; --line:#D5DCD7;
  --turf:#E3ECE5; --chalk:#FFFFFF; --clay:#E9DCCB;

  --hit:#C2410C; --out:#7C8A84; --err:#7C3AED; --other:#0E7490;
  --t0:#8A5A2B; --t1:#D9480F; --t2:#2563EB; --t3:#0F9488; --t4:#B7791F;
  --wedge:29,92,71; --good:#15803D; --bad:#B91C1C;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --hit:#FB923C; --out:#7F8F88; --err:#A78BFA; --other:#22D3EE;
  --t0:#C08A55; --t1:#F97316; --t2:#60A5FA; --t3:#2DD4BF; --t4:#FACC15;
  --wedge:108,196,161; --good:#4ADE80; --bad:#F87171; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#16201C; --ink:#E6EEE9; --muted:#9AA9A2; --line:#2A3832;
  --turf:#18261F; --chalk:#C9D6CF; --clay:#3A3026;
  --accent:#6CC4A1; --accent-soft:#1F3A2F; --on-accent:#0F1613;
  --hit:#FB923C; --out:#7F8F88; --err:#A78BFA; --other:#22D3EE;
  --t0:#C08A55; --t1:#F97316; --t2:#60A5FA; --t3:#2DD4BF; --t4:#FACC15;
  --wedge:108,196,161; --good:#4ADE80; --bad:#F87171; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.htext{display:flex;flex-direction:column;gap:6px;min-width:0}
.crest{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:150px;text-align:center}
.crest .badge{width:104px;height:104px;border-radius:18px;background:#FFFFFF;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.crest img{width:100%;height:100%;object-fit:contain;display:block}
.crest span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.3}
@media (max-width:560px){.crest .badge{width:72px;height:72px;border-radius:14px;padding:6px}.crest span{display:none}}
.tlogo{width:22px;height:22px;border-radius:5px;background:#FFFFFF;vertical-align:middle;margin-right:8px;object-fit:contain;border:1px solid var(--line)}
/* evolution */
.evo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.evo{grid-template-columns:1fr}}
.evo .card{gap:10px}
.evo svg{width:100%;height:auto;display:block;overflow:visible}
.evo .seg button{padding:5px 10px;font-size:13px}
.delta{font-size:13.5px;color:var(--muted)}

.evo-key i.ref{border-top:2px dashed var(--muted)}
.eyebrow,h2,h3,.lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,5vw,48px);line-height:1;margin:0;text-wrap:balance}
.sub{color:var(--muted);max-width:75ch;margin:0}
/* filter rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-block:-8px}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;align-items:end}
@media (max-width:1000px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.rail{position:static}}
@media (max-width:480px){.filters{grid-template-columns:1fr}}
.filters label{display:flex;flex-direction:column;gap:4px;min-width:0}
fieldset.yr{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:4px}
fieldset.yr legend{padding:0;margin-bottom:4px}
.ychips{display:flex;gap:6px;flex-wrap:wrap}
.ychips button{flex:1 1 0;min-width:52px;font-family:var(--f-mono);font-size:14px;padding:7px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.ychips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.filters .btn{align-self:end}
select,input[type=search]{font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
button{font:inherit;cursor:pointer}
.btn{font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;margin-top:10px}
.crumbs button{background:none;border:0;padding:2px 0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.crumbs span.sep{color:var(--muted)}
.crumbs b{font-weight:600}
/* title block */
.titleblock{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:end}
.who{font-family:var(--f-display);font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.02;text-wrap:balance}
.who-meta{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--clay);color:var(--ink)}
/* KPI band */
.kband{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}
@media (max-width:900px){.kband{grid-template-columns:1fr}}
.kgroup{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 10px}
.kpi{display:flex;flex-direction:column;gap:1px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums;font-weight:700}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.main b{color:var(--accent)}
.empty{color:var(--muted);font-size:14px}
/* spray */
.spray{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.spray{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.field{position:relative}
.field svg{width:100%;height:auto;display:block}

.seg button{border:0;background:var(--bg);color:var(--ink);font-size:13.5px;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

.fill{height:100%;background:var(--accent);border-radius:3px}
.v{text-align:right;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--turf)}

/* leaders */
.leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lead ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}

.lead li .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}

/* tables */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:5px 14px;font-size:13.5px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.tscroll{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.03em;color:var(--muted);cursor:pointer;user-select:none;z-index:1}
th.l,td.l{text-align:left}
td.small{color:var(--muted)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--turf)}
tfoot td{font-weight:600;background:var(--turf);position:sticky;bottom:0}
.note{color:var(--muted);font-size:13px;margin:0}
.notes{color:var(--muted);font-size:13px;max-width:95ch;display:flex;flex-direction:column;gap:6px}
.notes p{margin:0}
section{display:flex;flex-direction:column;gap:12px}
.crest[hidden]{display:none}
/* Smartphone: spray chart em evidência logo após o título, setores do campo logo abaixo, sem quadros de líderes */
@media (max-width:640px){
  body{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-top:12px}
  .wrap{gap:14px}
  .wrap>*{order:10}
  .wrap>header{order:0}
  .wrap>.rail{order:1}
  .wrap>.titleblock{order:2}
  .wrap>.spray{order:3}
  .wrap>.kband{order:4}
  #leadSec{display:none!important}
  .sub{display:none}
  h1{font-size:30px}
  .who{font-size:26px}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}
  .filters label:nth-child(5),.filters label:nth-child(6),.filters .yr{grid-column:1/-1}
  .filters .btn{grid-column:1/-1}
  .spray{gap:10px}
  .spray .card{padding:10px 10px 14px}
  .spray .field{border-color:var(--accent);border-width:2px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .spray .field .row h2{font-size:13px;color:var(--ink);font-weight:600}
  .spray .field svg{margin-inline:-4px;width:calc(100% + 8px)}
  .spray .card:not(.field) h2:first-child{font-size:13px;color:var(--ink);font-weight:600}
  #bSect{gap:9px}
  #bSect .bar{grid-template-columns:96px 1fr 46px;font-size:14.5px}
  #bSect .track{height:14px}
  #bSect .v{font-size:14px;font-weight:600}
  .legend{font-size:12.5px;gap:4px 12px}
}
</style>

<div class="wrap">
  <header style="display:none!important" aria-hidden="true">
    <div class="crest" id="crest" hidden><div class="badge"><img id="crestImg" alt=""></div><span id="crestName"></span></div>
  </header>

  <div class="rail">
    <section class="filters" aria-label="Filtros">
      <label for="fK"><span class="lbl">Categoria</span><select id="fK"></select></label>
      <label for="fT"><span class="lbl">Campeonato</span><select id="fT"></select></label>
      <label for="fC"><span class="lbl">Clube</span><select id="fC"></select></label>
      <label for="fE"><span class="lbl">Equipe</span><select id="fE"></select></label>
      <label for="fA"><span class="lbl">Atleta</span><select id="fA"></select></label>
      <label for="fS"><span class="lbl">Buscar atleta</span><input type="search" id="fS" list="dlA" placeholder="Digite o nome" autocomplete="off"></label>
      <fieldset class="yr"><legend class="lbl">Ano de nascimento · combine vários</legend><div class="ychips" id="fY" role="group" aria-label="Ano de nascimento"></div></fieldset>
      <button type="button" class="btn" id="reset">Limpar filtros</button>
    </section>
    <datalist id="dlA"></datalist>
    <nav class="crumbs" id="crumbs" aria-label="Navegação"></nav>
  </div>

  <div class="titleblock">
    <div>
      <div class="who" id="who"></div>
      <div class="who-meta" id="whoMeta"></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <section class="kband" aria-label="Principais estatísticas">
    <div class="kgroup"><h2>Rebatida</h2><div class="kgrid" id="kBat"></div></div>
    <div class="kgroup"><h2>Arremesso</h2><div class="kgrid" id="kPit"></div></div>
    <div class="kgroup"><h2>Defesa</h2><div class="kgrid" id="kDef"></div></div>
  </section>

  <section class="spray" aria-label="Spray chart">
    <div class="card field">
      <div class="row"><h2>Spray chart</h2>
        <div class="seg" role="group" aria-label="Cor dos pontos">
          <button type="button" id="cRes" aria-pressed="true">Resultado</button>
          <button type="button" id="cTra" aria-pressed="false">Trajetória</button>
        </div>
      </div>
      <svg id="svg" viewBox="-270 -335 540 365" role="img" aria-label="Campo com as bolas em jogo"></svg>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="card">
      <h2>Setor do campo</h2>
      <div class="bars" id="bSect"></div>
      <h2>Trajetória</h2>
      <div class="stack" id="sTra"></div>
      <div class="legend" id="lTra"></div>
      <h2>Profundidade</h2>
      <div class="bars" id="bDep"></div>
      <p class="note" id="sprayNote"></p>
    </div>
  </section>

  <section id="leadSec" aria-label="Líderes">
    <div class="row"><h2 id="leadTitle">Líderes</h2><span class="note" id="leadQ"></span></div>
    <div class="leaders" id="leaders"></div>
  </section>

  <section aria-label="Tabelas">
    <div class="row"><h2 id="tblTitle"></h2><div class="tabs" role="tablist" id="tabs"></div></div>
    <div class="tscroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div>
    <p class="note" id="tblNote"></p>
  </section>

  <section aria-label="Evolução ao longo do ano">
    <div class="row"><h2 id="evoTitle">Evolução ao longo do ano</h2><span class="note" id="evoNote"></span></div>
    <div class="evo">
      <div class="card"><div class="row"><h3>Rebatida</h3><div class="seg" role="group" aria-label="Métrica de rebatida" id="sgBat"></div></div><div class="delta" id="dBat"></div><svg id="evBat" viewBox="0 0 360 210" role="img" aria-label="Evolução de rebatida"></svg></div>
      <div class="card"><div class="row"><h3>Arremesso</h3><div class="seg" role="group" aria-label="Métrica de arremesso" id="sgPit"></div></div><div class="delta" id="dPit"></div><svg id="evPit" viewBox="0 0 360 210" role="img" aria-label="Evolução de arremesso"></svg></div>
      <div class="card"><div class="row"><h3>Defesa</h3><div class="seg" role="group" aria-label="Métrica de defesa" id="sgDef"></div></div><div class="delta" id="dDef"></div><svg id="evDef" viewBox="0 0 360 210" role="img" aria-label="Evolução de defesa"></svg></div>
    </div>
    <div class="evo-key" id="evoKey"></div>
  </section>

</div>

// ---------- spray chart

function spray(rows){
  const balls=rows.flatMap(r=>byRow[r.i]); const n=balls.length;
  const Rd=v=>v*Math.PI/180, pt=(d,a)=>[d*Math.sin(Rd(a)),-d*Math.cos(Rd(a))];
  const arc=(r,a0,a1)=>{const [x0,y0]=pt(r,a0),[x1,y1]=pt(r,a1);return `M${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1}`};

  const mx=Math.max(1,...sc), bounds=[-45,-26.5,-9.5,9.5,26.5,45], w=css('--wedge');

  for(let i=0;i<5;i++){const [x,y]=pt(318,(bounds[i]+bounds[i+1])/2); h+=`<text x="${x}" y="${y}" text-anchor="middle" font-family="var(--f-display)" font-weight="700" font-size="18" fill="var(--ink)">${n?Math.round(100*sc[i]/n)+'%':''}</text>`;}
  [['Campo esquerdo',-30],['Centro',0],['Campo direito',30]].forEach(([t,a])=>{const [x,y]=pt(268,a);h+=`<text x="${x}" y="${y}" text-anchor="middle" font-family="var(--f-mono)" font-size="9" fill="var(--muted)" letter-spacing=".06em">${t.toUpperCase()}</text>`});

  $('svg').innerHTML=h;
  $('legend').innerHTML=(colorBy==='res'?RG.map(g=>[g.n,g.v]):TR.map((t,i)=>[t,TRV[i]])).map(([t,v])=>`<span><i class="dot" style="background:var(${v})"></i>${t}</span>`).join('');
  const bars=(el,rs)=>el.innerHTML=rs.map(([l,v])=>`<div class="bar"><span>${l}</span><div class="track"><div class="fill" style="width:${(v*100).toFixed(1)}%"></div></div><span class="v">${n?Math.round(v*100)+'%':'—'}</span></div>`).join('');
  bars($('bSect'),SECT.map((s,i)=>[s,n?sc[i]/n:0]).concat(foul?[['Foul',foul/n]]:[]));
  const tc=[0,0,0,0,0]; balls.forEach(b=>tc[b[3]]++);

function drawEvo(svg,ys,ref,m,A,has,k,ET){

function zoneIn(x,y){return x>=1&&x<=3&&y>=1&&y<=3}

function zoneLbl(x,y){if(x==null) return '';const n=zoneNum(x,y);if(n) return String(n);const v=y===0?'alta':(y===4?'baixa':'');const h=x===0?'esquerda':(x===4?'direita':'');return 'Fora '+[v,h].filter(Boolean).join('-');}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function blankDB(){return {v:2,teams:[],myTeamId:null,team:{name:'Meu Time',abbr:'MEU'},players:[],games:[],currentGameId:null,lastBackup:null,pitch:[],outbox:[]}}
function nameParts(off){
  const [sur,giv]=String(off).split(',').map(s=>(s||'').trim());
  const tc=s=>s.toLocaleLowerCase('pt-BR').replace(/(^|[\s'-])(\p{L})/gu,(m,a,b)=>a+b.toLocaleUpperCase('pt-BR'));
  const g=(giv||'').split(/\s+/).filter(Boolean);
  return {first:g[0]||'',second:g[1]||'',sur:tc(sur||'')};
}
function seedDB(){
  const db=blankDB();
  db.myTeamId='NKC';
  for(const [code,[name,list]] of Object.entries(SEED_CLUBS)){
    db.teams.push({id:code,name,abbr:code,logo:code});
    const parts=list.map(([w,off])=>Object.assign({w,off},nameParts(off)));
    const cnt={};parts.forEach(p=>{const k=p.first+' '+p.sur;cnt[k]=(cnt[k]||0)+1;});
    parts.forEach(p=>{const k=p.first+' '+p.sur;const nm=(cnt[k]>1&&p.second)?p.first+' '+p.second+' '+p.sur:k;
      db.players.push({id:'w'+p.w,name:nm.trim(),full:p.off,num:'',pos:'',bats:'',thr:'',teamId:code,wbsc:p.w});});
  }
  return db;
}
function migrateDB(d){
  if(!d) return seedDB();
  if((d.v||1)>=2){d.pitch=d.pitch||[];d.outbox=d.outbox||[];return d;}
  const onlyDemo=!d.games.some(g=>!g.demo)&&!d.players.some(p=>!p.demo);
  const s=seedDB();
  if(onlyDemo){s.lastBackup=d.lastBackup||null;return s;}
  const leg={id:'LEG',name:(d.team&&d.team.name)||'Meu Time',abbr:((d.team&&d.team.abbr)||'MEU').slice(0,4),logo:null};
  d.players.forEach(p=>{p.teamId='LEG';});
  d.games.forEach(g=>{g.myTeamId='LEG';});
  s.teams.unshift(leg);
  s.players=d.players.concat(s.players);
  s.games=d.games;s.currentGameId=d.currentGameId;s.lastBackup=d.lastBackup||null;
  return s;
}
function baseLbl(b){return ['out','1ª','2ª','3ª','casa'][b]}
function fl1(fl){return String(fl||'').split('-')[0]||''}

function forcedMoves(bases){
  const m={B:1};
  if(bases[0]){m['1']=2; if(bases[1]){m['2']=3; if(bases[2]) m['3']=4;}}
  return m;
}
function defaultMoves(res,bases){
  const on=b=>!!bases[b-1];
  let m={};
  const adv=n=>{for(const b of [3,2,1]) if(on(b)) m[String(b)]=Math.min(4,b+n);};
  const lead=()=>on(1)?1:(on(2)?2:(on(3)?3:0));
  switch(res){
    case 'BB':case 'IBB':case 'HBP':case 'CI':case 'E':case 'K3': m=forcedMoves(bases); break;
    case '1B': m.B=1; adv(1); break;
    case '2B': m.B=2; adv(2); break;
    case '3B': m.B=3; adv(4); break;
    case 'HR': m.B=4; adv(4); break;
    case 'SF': m.B=0; if(on(3)) m['3']=4; break;
    case 'SH': m.B=0; adv(1); break;
    case 'DP': {m.B=0; const l=lead(); if(l) m[String(l)]=0; break;}
    case 'TP': {m.B=0; let n=0; for(const b of [1,2,3]) if(on(b)&&n<2){m[String(b)]=0;n++;} break;}
    case 'FC': {m.B=1; const l=lead(); if(l) m[String(l)]=0; break;}
    default: m.B=0;
  }
  for(const b of [1,2,3]) if(on(b)&&m[String(b)]===undefined) m[String(b)]=b;
  return m;
}
function runsIn(m){return Object.values(m).filter(v=>v===4).length}
function defaultRbi(res,m){return ['E','DP','TP','K3','K','KL'].includes(res)?0:runsIn(m)}

function notation(ev){
  if(!ev||ev.t!=='pa') return '';
  const fl=ev.fl||'', f1=fl1(fl);
  switch(ev.res){
    case '1B':case '2B':case '3B':case 'HR': return ev.res+(f1?'('+f1+')':'');
    case 'OUT':{
      if(ev.ht==='F'||ev.ht==='L'||ev.ht==='P') return ev.ht+(f1||'');
      if(!fl) return 'OUT';
      const n=fl.split('-').length;
      if(ev.ht==='G'||ev.ht==='B') return (ev.ht==='B'?'B':'')+(n===1?fl+'U':fl);
      return fl;
    }
    case 'SF': return 'SF'+f1;
    case 'SH': return 'SH'+(fl?' '+fl:'');
    case 'DP': return 'DP'+(fl?' '+fl:'');
    case 'TP': return 'TP'+(fl?' '+fl:'');
    case 'FC': return 'FC'+f1;
    case 'E': return 'E'+(f1||((ev.errs&&ev.errs[0])||''));
    case 'K3': return 'K'+(fl?' '+fl:'')+'*';
    default: return ev.res;
  }
}
function battingSide(g,half){return half===0?(g.home?'opp':'my'):(g.home?'my':'opp')}

function replay(g){
  const S={inning:1,half:0,outs:0,balls:0,strikes:0,bases:[null,null,null],
    slot:{my:0,opp:0},
    lineup:{my:(g.my.lineup||[]).map(x=>'m:'+x.pid),opp:g.opp.keys?g.opp.keys.slice():(g.opp.lineup||[]).map(id=>'o:'+id)},
    pitcher:{my:'m:'+g.my.pitcher,opp:g.opp.pKey||'o:'+g.opp.pitcher},
    runs:{my:[0],opp:[0]},hits:{my:0,opp:0},errors:{my:0,opp:0},lob:{my:0,opp:0},
    seq:[],plays:[],pitches:[],np:{}};
  const bs=()=>battingSide(g,S.half);
  const fs=()=>bs()==='my'?'opp':'my';
  const ensure=()=>{for(const s of ['my','opp']) while(S.runs[s].length<S.inning) S.runs[s].push(0);};
  const total=s=>S.runs[s].reduce((a,b)=>a+b,0);
  const endHalf=()=>{S.lob[bs()]+=S.bases.filter(Boolean).length;S.bases=[null,null,null];S.outs=0;S.balls=0;S.strikes=0;S.seq=[];
    if(S.half===0) S.half=1; else {S.half=0;S.inning++;} ensure();};
  const countPitch=(r,pt,z,batter,pitcher)=>{
    S.np[pitcher]=(S.np[pitcher]||0)+1;
    S.pitches.push({gid:g.id,inning:S.inning,half:S.half,batter,pitcher,n:S.seq.length+1,r,pt:pt||'',zx:z?z[0]:null,zy:z?z[1]:null,balls:S.balls,strikes:S.strikes});
    S.seq.push(r);
  };
  const applyMoves=(mv,batterRunner,play)=>{
    const nb=[null,null,null];let outs=0,runs=0;const scorers=[],charged={};
    const b0=S.bases.slice();
    const place=(runner,to)=>{
      if(to===0){outs++;return;}
      if(to===4){runs++;scorers.push(runner.key);charged[runner.resp]=(charged[runner.resp]||0)+1;return;}
      nb[to-1]=runner;
    };
    for(const b of [3,2,1]){const r=b0[b-1]; if(!r) continue; const t=mv[String(b)]!==undefined?mv[String(b)]:b; place(r,t);}
    if(batterRunner&&mv.B!==undefined) place(batterRunner,mv.B);
    S.bases=nb;S.outs+=outs;ensure();S.runs[bs()][S.inning-1]+=runs;
    play.runs=runs;play.outsOnPlay=outs;play.scorers=scorers;play.charged=charged;
  };
  (g.events||[]).forEach((ev,i)=>{
    ensure();
    const side=bs(),fside=fs();
    const lu=S.lineup[side];
    const batter=lu.length?lu[S.slot[side]%lu.length]:null;
    const pitcher=S.pitcher[fside];
    if(ev.t==='pitch'){
      countPitch(ev.r,ev.pt,ev.z,batter,pitcher);
      if(ev.r==='B') S.balls=Math.min(3,S.balls+1);
      else if(ev.r==='C'||ev.r==='S') S.strikes=Math.min(2,S.strikes+1);
      else if(ev.r==='F'&&S.strikes<2) S.strikes++;
      return;
    }
    if(ev.t==='sub'){
      const prev=ev.role==='P'?S.pitcher[ev.side]:S.lineup[ev.side][ev.slot];
      if(ev.role==='P') S.pitcher[ev.side]=ev.key; else S.lineup[ev.side][ev.slot]=ev.key;
      S.plays.push({i,t:'sub',gid:g.id,inning:S.inning,half:S.half,side:ev.side,role:ev.role,key:ev.key,prev,slot:ev.slot,note:ev.note||'',
        scoreAfter:{my:total('my'),opp:total('opp')}});
      return;
    }
    const snap={i,t:ev.t,gid:g.id,inning:S.inning,half:S.half,side,fside,batter,pitcher,outsBefore:S.outs,
      basesBefore:S.bases.map(r=>r?r.key:null),scoreBefore:{my:total('my'),opp:total('opp')},note:ev.note||''};
    if(ev.t==='pa'){
      snap.count=S.balls+'-'+S.strikes;
      if(ev.res!=='IBB'&&ev.last) countPitch(ev.last.r,ev.last.pt,ev.last.z,batter,pitcher);
      snap.seq=S.seq.join(' ');snap.np=S.seq.length;snap.res=ev.res;snap.not=notation(ev);
      snap.ht=ev.ht||'';snap.sp=ev.sp||null;snap.fl=ev.fl||'';snap.rbi=ev.rbi||0;snap.errs=ev.errs||[];
      applyMoves(ev.mv||{},{key:batter,resp:pitcher},snap);
      S.errors[fside]+=(ev.errs||[]).length;
      if(RES[ev.res]&&RES[ev.res].hit) S.hits[side]++;
      snap.scoreAfter={my:total('my'),opp:total('opp')};
      S.plays.push(snap);
      S.slot[side]=(S.slot[side]+1)%Math.max(1,lu.length);
      S.balls=0;S.strikes=0;S.seq=[];
      if(S.outs>=3) endHalf();
      return;
    }
    if(ev.t==='run'){
      snap.kind=ev.k;snap.errs=ev.errs||[];
      snap.movers=[];
      for(const b of [1,2,3]){const r=snap.basesBefore[b-1];const to=(ev.mv||{})[String(b)];if(r&&to!==undefined&&to!==b) snap.movers.push({key:r,from:b,to});}
      applyMoves(ev.mv||{},null,snap);
      S.errors[fside]+=(ev.errs||[]).length;
      snap.not=ev.k;snap.scoreAfter={my:total('my'),opp:total('opp')};
      S.plays.push(snap);
      if(S.outs>=3) endHalf();
    }
  });
  ensure();
  S.total={my:total('my'),opp:total('opp')};
  return S;
}

function simPA(g,res,o){
  o=o||{};
  const S=replay(g);
  const mv=Object.assign(defaultMoves(res,S.bases),o.mv||{});
  const ev={t:'pa',res,mv,rbi:o.rbi!=null?o.rbi:defaultRbi(res,mv),ht:o.ht||null,sp:o.sp||null,fl:o.fl||'',
    errs:o.errs||(res==='E'&&o.fl?[fl1(o.fl)]:[]),note:o.note||'',last:o.last!==undefined?o.last:(res==='IBB'?null:{r:'X'})};
  g.events.push(ev);
  return ev;
}
function simPitch(g,r,meta){
  meta=meta||{};
  const S=replay(g);
  if(r==='B'&&S.balls===3) return simPA(g,'BB',{last:Object.assign({r:'B'},meta)});
  if((r==='C'||r==='S')&&S.strikes===2) return simPA(g,r==='C'?'KL':'K',{last:Object.assign({r},meta)});
  const ev=Object.assign({t:'pitch',r},meta);
  g.events.push(ev);
  return ev;
}

function makeNamer(db){
  const m={};
  (db.players||[]).forEach(p=>m['m:'+p.id]=p);
  (db.games||[]).forEach(g=>(g.oppPlayers||[]).forEach(o=>m['o:'+o.id]=o));
  return (key,short)=>{
    if(!key) return '—';
    const p=m[key]; if(!p) return '(removido)';
    const n=short?String(p.name||'').split(' ')[0]:p.name;
    return (p.num?'#'+p.num+' ':'')+(n||'');
  };
}
function dirOf(sp){
  if(!sp) return '';
  const a=Math.atan2(sp[0]-150,262-sp[1])*180/Math.PI;
  return a<-15?'Esquerda':(a>15?'Direita':'Centro');
}
function nearestPos(x,y){
  let best=1,bd=1e9;
  for(const k in FPOS){const [px,py]=FPOS[k]; if(k==='2'&&y<240) continue; const d=(px-x)**2+(py-y)**2; if(d<bd){bd=d;best=+k;}}
  return best;
}

function aggregate(games){
  const bat={},pit={},plays=[],pitches=[],myBat=new Set(),myPit=new Set();
  const B=k=>bat[k]||(bat[k]={key:k,G:new Set(),PA:0,AB:0,H:0,'1B':0,'2B':0,'3B':0,HR:0,R:0,RBI:0,BB:0,IBB:0,HBP:0,K:0,SF:0,SH:0,SB:0,CS:0,GDP:0,ROE:0,TB:0});
  const P=k=>pit[k]||(pit[k]={key:k,G:new Set(),BF:0,OUTS:0,NP:0,STR:0,FP:0,FPS:0,H:0,R:0,BB:0,HBP:0,K:0,HR:0,GB:0,AIR:0});
  const states={};
  for(const g of games){
    const S=replay(g); states[g.id]=S;
    for(const pc of S.pitches){
      pitches.push(pc);
      if(!pc.pitcher) continue;
      const p=P(pc.pitcher); p.G.add(g.id); p.NP++;
      const isStr='CSFX'.includes(pc.r);
      if(isStr) p.STR++;
      if(pc.n===1){p.FP++; if(isStr) p.FPS++;}
    }
    for(const pl of S.plays){
      plays.push(pl);
      if(pl.t==='sub') continue;
      if(pl.batter&&pl.side==='my') myBat.add(pl.batter);
      if(pl.pitcher&&pl.fside==='my') myPit.add(pl.pitcher);
      if(pl.pitcher){const p=P(pl.pitcher); p.G.add(g.id); p.OUTS+=pl.outsOnPlay||0;}
      for(const k of pl.scorers||[]) B(k).R++;
      for(const k in pl.charged||{}) P(k).R+=pl.charged[k];
      if(pl.t==='pa'&&pl.batter){
        const b=B(pl.batter),r=RES[pl.res]||{};
        b.G.add(g.id); b.PA++;
        if(r.ab) b.AB++;
        if(r.hit){b.H++; b[pl.res]++; b.TB+=r.tb;}
        if(pl.res==='BB') b.BB++;
        if(pl.res==='IBB') b.IBB++;
        if(pl.res==='HBP') b.HBP++;
        if(r.k) b.K++;
        if(pl.res==='SF') b.SF++;
        if(pl.res==='SH') b.SH++;
        if(pl.res==='DP') b.GDP++;
        if(pl.res==='E') b.ROE++;
        b.RBI+=pl.rbi||0;
        if(pl.pitcher){
          const p=P(pl.pitcher); p.BF++;
          if(r.hit) p.H++;
          if(pl.res==='HR') p.HR++;
          if(pl.res==='BB'||pl.res==='IBB') p.BB++;
          if(pl.res==='HBP') p.HBP++;
          if(r.k) p.K++;
          if(pl.ht==='G'||pl.ht==='B') p.GB++;
          if(pl.ht==='F'||pl.ht==='L'||pl.ht==='P') p.AIR++;
        }
      }
      if(pl.t==='run'){
        for(const m of pl.movers||[]){
          if(pl.kind==='SB'&&m.to>m.from) B(m.key).SB++;
          if(pl.kind==='CS'&&m.to===0) B(m.key).CS++;
        }
      }
    }
  }
  return {bat,pit,plays,pitches,states,myBat,myPit};
}
function batRates(s){
  const AVG=s.AB?s.H/s.AB:null;
  const od=s.AB+s.BB+s.IBB+s.HBP+s.SF;
  const OBP=od?(s.H+s.BB+s.IBB+s.HBP)/od:null;
  const SLG=s.AB?s.TB/s.AB:null;
  const OPS=(OBP!=null&&SLG!=null)?OBP+SLG:null;
  return {AVG,OBP,SLG,OPS,Kp:s.PA?s.K/s.PA:null,BBp:s.PA?(s.BB+s.IBB)/s.PA:null};
}
function pitRates(p){
  const ip=p.OUTS/3;
  return {IP:Math.floor(p.OUTS/3)+'.'+(p.OUTS%3),ipN:ip,WHIP:ip?(p.H+p.BB)/ip:null,RA9:ip?p.R*9/ip:null,

}
function splitOf(plays){
  const s={PA:0,AB:0,H:0,TB:0,BB:0,HBP:0,SF:0,K:0};
  for(const p of plays){const r=RES[p.res]||{}; s.PA++; if(r.ab) s.AB++; if(r.hit){s.H++;s.TB+=r.tb;} if(p.res==='BB'||p.res==='IBB') s.BB++; if(p.res==='HBP') s.HBP++; if(p.res==='SF') s.SF++; if(r.k) s.K++;}
  const od=s.AB+s.BB+s.HBP+s.SF;
  s.AVG=s.AB?s.H/s.AB:null; s.OBP=od?(s.H+s.BB+s.HBP)/od:null; s.SLG=s.AB?s.TB/s.AB:null;
  s.Kp=s.PA?s.K/s.PA:null; s.BBp=s.PA?s.BB/s.PA:null;
  return s;
}

  if(p.t==='run') return `${esc(RUNK[p.kind]||p.kind)}: `+(p.movers||[]).map(m=>`${esc(N(m.key,true))} ${baseLbl(m.from)}→${baseLbl(m.to)}`).join(', ');
  if(p.t==='sub') return `Entra ${esc(N(p.key,true))} (${p.role==='P'?'arremessador':'rebatedor'}) no lugar de ${esc(N(p.prev,true))}`;
  return '';
}
function logItem(p,clickable){
  const nt=p.t==='pa'?p.not:(p.t==='run'?p.kind:'TROCA');
  const meta=p.t==='pa'?`<small>${p.count} · ${p.np} arr. · ${esc(p.seq||'')}</small>`:'';
  const rs=p.runs?`+${p.runs} ${p.runs>1?'corridas':'corrida'}`:(p.outsOnPlay?`${p.outsOnPlay} out${p.outsOnPlay>1?'s':''}`:'');
  const note=p.note?`<span class="nb">✎ ${esc(p.note)}</span>`:'';
  const tag=clickable?'button':'div';
  return `<${tag} class="log-item" ${clickable?`data-a="play-open" data-i="${p.i}"`:''}><span class="nt">${esc(nt)}</span><span class="ds">${playDesc(p)}${meta}${note}</span><span class="rs">${rs}</span></${tag}>`;
}

/* ---------- zona 1-9 e fichas de arremesso ---------- */
function zoneGridHtml(o){
  o=o||{};
  let h=`<div class="zgrid${o.small?' sm':''}" role="group" aria-label="Zona de strike, visão do receptor">`;
  for(let y=0;y<5;y++) for(let x=0;x<5;x++){
    const inZ=zoneIn(x,y),n=zoneNum(x,y),c=o.counts?o.counts[y*5+x]:0;
    const on=o.sel&&o.sel[0]===x&&o.sel[1]===y;
    h+=`<button class="${inZ?'zi':'zo'}${on?' on':''}" data-a="${o.act}" data-x="${x}" data-y="${y}" aria-label="${inZ?'Quadro '+n:esc(zoneLbl(x,y))}${c?', '+c+' arremessos':''}">${inZ?n:zoneArrow(x,y)}${o.counts&&c?`<small>${c}</small>`:''}</button>`;
  }
  return h+'</div>';
}
function pitchMain(pt,x,y){const z=x==null?'':(zoneNum(x,y)!=null?zoneNum(x,y):zoneArrow(x,y));return ((pt?PINI[pt]||'':'')+(z!==''?(pt?' ':'')+z:''))||'·';}
function pitchChip(n,pt,x,y,extra){
  const cls=x==null?'':(zoneIn(x,y)?' s':' b');
  return `<span class="pc${cls}"><small>${n}</small>${esc(pitchMain(pt,x,y))}${extra?` <small>${esc(extra)}</small>`:''}</span>`;
}

  h+=`<h3>Últimas jogadas</h3><div class="log">${recent.length?recent.map(p=>logItem(p,true)).join(''):'<p class="muted small">Ainda não há jogadas. Comece pelo primeiro arremesso.</p>'}</div>`;
  h+=`<div class="row" style="margin-top:16px"><button class="btn ghost" data-a="open-game" data-id="${g.id}">Jogo completo</button><button class="btn ghost" data-a="wa" data-k="game" data-r="${g.id}">WhatsApp</button><button class="btn ghost" data-a="wake">${UI.wake?'Tela acesa ✓':'Manter tela acesa'}</button><button class="btn ghost danger" data-a="end-game">Encerrar jogo</button></div>`;
  return h;
}

let sheetRender=null;

function drawSheet(first){

  const nb=$('#sheet .sheet-body'); if(nb&&!first) nb.scrollTop=st;
}
function closeSheet(){sheetRender=null;$('#sheet').hidden=true;$('#backdrop').hidden=true;$('#sheet').innerHTML='';document.body.style.overflow='';UI.draft=null;UI.rdraft=null;}
function sheetErr(msg){const e=$('#sheet-err');if(e){e.textContent=msg;e.hidden=false;e.scrollIntoView({block:'nearest'});}}
function confirmSheet(title,msg,okLabel,fn,danger){
  openSheet(()=>({title:esc(title),body:`<p>${msg}</p>`,foot:`<button class="btn" data-a="sheet-close">Cancelar</button><button class="btn ${danger?'danger':'primary'}" data-a="confirm-ok">${esc(okLabel)}</button>`}));

let CONFIRM_FN=null;

function chip(a,v,l,on,extra){return `<button class="chip${on?' on':''}${extra?' '+extra:''}" data-a="${a}" data-v="${v}">${l}</button>`;}
function moveRows(S,mv,withBatter,act,batterKey){
  const rows=[];
  const who=[...[3,2,1].filter(b=>S.bases[b-1]).map(String),...(withBatter?['B']:[])];
  for(const w of who){
    const from=w==='B'?0:+w;
    const key=w==='B'?batterKey:S.bases[from-1].key;
    const label=w==='B'?'Rebatedor':`Corredor na ${from}ª`;
    const cur=mv[w]!==undefined?mv[w]:(w==='B'?undefined:from);
    let opts=`<button class="chip sm out${cur===0?' on':''}" data-a="${act}" data-w="${w}" data-v="0">Out</button>`;
    for(let t=Math.max(1,from);t<=4;t++){
      const l=t===4?'Casa':(t===from?`${t}ª (fica)`:`${t}ª`);
      opts+=`<button class="chip sm${cur===t?' on':''}" data-a="${act}" data-w="${w}" data-v="${t}">${l}</button>`;
    }
    rows.push(`<div class="mv-row"><div class="who2">${label} <span>· ${esc(N(key))}</span></div><div class="chips">${opts}</div></div>`);
  }
  return rows.join('');
}
function checkMoves(mv,S,withBatter){
  const who=[...(withBatter?['B']:[]),...[1,2,3].filter(b=>S.bases[b-1]).map(String)];
  const lbl={B:'O rebatedor','1':'O corredor da 1ª','2':'O corredor da 2ª','3':'O corredor da 3ª'};
  const occ={};const fin=[];
  for(const w of who){
    const t=mv[w]!==undefined?mv[w]:(w==='B'?undefined:+w);
    if(t===undefined) return 'Indique para onde foi o rebatedor.';
    if(t>=1&&t<=3){if(occ[t]) return `${lbl[w]} e ${lbl[occ[t]].toLowerCase()} terminaram na mesma base (${t}ª).`;occ[t]=w;}
    fin.push({o:w==='B'?0:+w,t});
  }
  const alive=fin.filter(x=>x.t!==0).sort((a,b)=>a.o-b.o);
  for(let i=0;i<alive.length-1;i++){const a=alive[i],b=alive[i+1];if(a.t>=b.t&&!(a.t===4&&b.t===4)) return 'Um corredor não pode passar à frente do corredor que está adiante dele.';}
  const outs=fin.filter(x=>x.t===0).length;
  if(S.outs+outs>3) return `Isso daria ${S.outs+outs} outs na entrada. O máximo é 3.`;
  return null;
}

function resultTag(S){return S.total.my>S.total.opp?'<span class="res v">V</span>':(S.total.my<S.total.opp?'<span class="res d">D</span>':'<span class="res">E</span>');}
function vGames(){
  let h=`<div class="row between"><h2 style="margin:0">Jogos</h2><button class="btn primary" data-a="new-game">Novo jogo</button></div>`;
  if(!DB.games.length) return h+`<p class="muted" style="margin-top:12px">Nenhum jogo salvo ainda.</p>`;
  const list=DB.games.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.created-a.created);
  let w=0,l=0,t=0;
  const items=list.map(g=>{
    const S=replay(g);
    if(g.final){if(S.total.my>S.total.opp)w++;else if(S.total.my<S.total.opp)l++;else t++;}
    return `<button class="list-btn game" data-a="open-game" data-id="${g.id}">${crest(teamById(g.oppTeamId)||{},g.oppAbbr,40)}<div><div class="t">vs ${esc(g.oppName)}${g.id===DB.currentGameId&&!g.final?' <span class="pill live">em andamento</span>':''}</div><div class="s">${esc(fmtDate(g.date))} · ${g.home?'em casa':'fora'} · ${plural(S.plays.filter(p=>p.t==='pa').length,'vez ao bastão','vezes ao bastão')}</div></div><div class="sc">${S.total.my}–${S.total.opp} ${g.final?resultTag(S):''}</div></button>`;
  });
  h+=`<p class="muted small" style="margin:10px 0">Retrospecto dos jogos encerrados: <b>${w}</b> V · <b>${l}</b> D${t?` · <b>${t}</b> E`:''}</p><div class="stack">${items.join('')}</div>`;

}

function fillMy(f){
  const r=teamPlayers(f.myTeamId);
  const pool=r.filter(p=>p.pos!=='P');
  f.my=(pool.length>=9?pool:r).slice(0,9).map(p=>({pid:p.id,pos:p.pos||''}));
  if(!f.my.length) f.my=[{pid:'',pos:''}];
  const pit=r.find(p=>p.pos==='P')||r[0];f.myP=pit?pit.id:'';
}
function fillOpp(f){
  if(f.oppTeamId){
    const r=teamPlayers(f.oppTeamId),t=teamById(f.oppTeamId);
    f.opp=r.slice(0,9).map(p=>({pid:p.id,num:'',name:''}));
    if(!f.opp.length) f.opp=[{pid:'',num:'',name:''}];
    f.oppName=t.name;f.oppAbbr=t.abbr;
    const pit=r.find(p=>p.pos==='P')||r[0];f.oppP=pit?pit.id:'';
  } else {
    f.opp=[...Array(9)].map(()=>({pid:'',num:'',name:''}));f.oppName='';f.oppAbbr='';f.oppP='';
  }
}

      <p class="foot-note">A contagem considerada é a do momento do último arremesso da vez. Amostras pequenas variam muito: olhe a coluna PA antes de tirar conclusões.</p>`;

  if(UI.statsTab==='spray'){
    const keys=[...new Set(A.plays.filter(p=>p.t==='pa'&&p.sp).map(p=>p.batter))];
    const opts=`<option value="team">Time todo · ${esc(myName)}</option><option value="oppteam"${UI.spray==='oppteam'?' selected':''}>Adversários</option>`+keys.filter(myKey).map(k=>`<option value="${k}"${UI.spray===k?' selected':''}>${esc(N(k))}</option>`).join('')+keys.filter(k=>!myKey(k)).map(k=>`<option value="${k}"${UI.spray===k?' selected':''}>${esc(N(k))} (adv.)</option>`).join('');
    const pts=A.plays.filter(p=>p.t==='pa'&&p.sp&&(UI.spray==='team'?p.side==='my':UI.spray==='oppteam'?p.side==='opp':p.batter===UI.spray));
    const cls=p=>(RES[p.res]||{}).hit?'hit':(['FC','E'].includes(p.res)?'reach':'out');
    h+=`<label class="f" style="margin-top:12px">Rebatedor<select id="st-spray">${opts}</select></label>`;
    h+=`<div class="card" style="margin-top:10px">${fieldSvg({points:pts.map(p=>({sp:p.sp,c:cls(p)})),labels:false})}<div class="legend" style="margin-top:6px"><span><i style="background:var(--accent)"></i>Rebatida</span><span><i style="border:2px solid var(--out);background:var(--surface)"></i>Eliminado</span><span><i style="background:var(--strike);border-radius:1px;transform:rotate(45deg)"></i>Erro / escolha</span></div></div>`;
    const n=pts.length||1;
    const dir={Esquerda:0,Centro:0,Direita:0};pts.forEach(p=>dir[dirOf(p.sp)]++);

    const htTot=Object.values(ht).reduce((a,b)=>a+b,0)||1;
    h+=`<div class="grid2" style="margin-top:12px"><div class="card"><div class="lbl" style="margin-bottom:8px">Direção · ${plural(pts.length,'bola','bolas')}</div><div class="bars">${Object.entries(dir).map(([k,v])=>bar(k,v,n)).join('')}</div></div>
      <div class="card"><div class="lbl" style="margin-bottom:8px">Tipo de contato</div><div class="bars">${Object.entries(HT).map(([k,l])=>bar(l,ht[k]||0,htTot)).join('')}</div></div></div>
      <p class="foot-note">Direção vista do home: esquerda = lado do 3B e LF. Para um destro, puxar a bola é para a esquerda; para um canhoto, para a direita.</p>`;
  }
  if(UI.statsTab==='zone'){
    const pks=[...new Set(A.pitches.filter(p=>p.zx!=null).map(p=>p.pitcher))];
    if(!pks.length) return h+`<p class="muted" style="margin-top:14px">Nenhum arremesso com local marcado. Use "Tipo e local do arremesso" na tela de marcação.</p>`;
    if(!pks.includes(UI.zoneKey)) UI.zoneKey=pks.find(myKey)||pks[0];
    const list=A.pitches.filter(p=>p.pitcher===UI.zoneKey&&p.zx!=null);
    const grid=Array.from({length:25},()=>({n:0,s:0}));
    list.forEach(p=>{const c=grid[p.zy*5+p.zx];c.n++;if('CSFX'.includes(p.r)) c.s++;});
    const max=Math.max(1,...grid.map(c=>c.n));
    const inZ=list.filter(p=>p.zx>=1&&p.zx<=3&&p.zy>=1&&p.zy<=3).length;
    const swOut=list.filter(p=>!(p.zx>=1&&p.zx<=3&&p.zy>=1&&p.zy<=3)&&(p.r==='S'||p.r==='F'||p.r==='X')).length;
    const outZ=list.length-inZ;
    h+=`<label class="f" style="margin-top:12px">Arremessador<select id="st-zone">${pks.map(k=>`<option value="${k}"${UI.zoneKey===k?' selected':''}>${esc(N(k))}${myKey(k)?'':' (adv.)'}</option>`).join('')}</select></label>`;
    h+=`<div class="grid2" style="margin-top:10px"><div class="card"><div class="heat">${grid.map((c,i)=>{const x=i%5,y=Math.floor(i/5);const iz=x>=1&&x<=3&&y>=1&&y<=3;const pct=Math.round(c.n/max*70);return `<div class="${iz?'in':''}" style="background:color-mix(in srgb,var(--accent) ${pct}%,var(--surface));color:${pct>40?'var(--accent-ink)':'var(--ink)'}" title="${c.n} arremessos, ${c.s} strikes">${c.n||''}</div>`;}).join('')}</div><div class="zone-cap">Visão do receptor · número = arremessos no ponto · centro 3x3 = quadros 1 a 9</div></div>
      <div class="card"><div class="lbl" style="margin-bottom:8px">Resumo · ${plural(list.length,'arremesso marcado','arremessos marcados')}</div>
      <div class="bars">
        <div class="bar"><span>Na zona</span><span class="t"><i style="width:${Math.round(inZ/list.length*100)}%"></i></span><span class="v">${Math.round(inZ/list.length*100)}%</span></div>
        <div class="bar"><span>Fora: girou</span><span class="t"><i style="width:${outZ?Math.round(swOut/outZ*100):0}%"></i></span><span class="v">${outZ?Math.round(swOut/outZ*100):0}%</span></div>
      </div>
      <div class="tbl" style="margin-top:12px"><table><thead><tr><th>Tipo</th><th>Qtd.</th><th>Str%</th></tr></thead><tbody>${Object.entries(PTYPE).map(([k,l])=>{const t=list.filter(p=>p.pt===k);if(!t.length) return '';return `<tr><td>${PINI[k]} · ${l}</td><td>${t.length}</td><td>${pc(t.filter(p=>'CSFX'.includes(p.r)).length/t.length)}</td></tr>`;}).join('')}</tbody></table></div></div></div>
      <p class="foot-note">"Fora: girou" é a % de arremessos fora da zona em que o rebatedor girou (strike girando, falta ou bola em jogo).</p>`;
  }
  return h;
}

/* ================= Pitcher Data ================= */
const pdById=id=>(DB.pitch||[]).find(p=>p.id===id)||null;
function pdStats(s){
  const P=s.pitches||[],zone=Array(25).fill(0),by={};let st=0,sw=0,swOut=0;
  for(const p of P){const [x,y]=p.z;zone[y*5+x]++;const iz=zoneIn(x,y),i=iz||!!p.sw;if(i) st++;
    if(p.sw){sw++;if(!iz) swOut++;}
    const b=by[p.pt]||(by[p.pt]={n:0,s:0,zone:Array(25).fill(0)});b.n++;if(i) b.s++;b.zone[y*5+x]++;}
  return {n:P.length,st,b:P.length-st,sw,swOut,zone,by,pct:P.length?st/P.length:null};
}
function pdChip(n,p){const [x,y]=p.z,s=zoneIn(x,y)||p.sw;
  return `<span class="pc ${s?'s':'b'}${p.sw?' sw':''}"><small>${n}</small>${esc(pitchMain(p.pt,x,y))}${p.sw?' <small>G</small>':''}</span>`;}
function pdTypes(by){return [...PT_PD,...Object.keys(by).filter(k=>!PT_PD.includes(k))].filter(k=>by[k]);}
function pdOutGroups(zone){
  const g={alta:0,baixa:0,esquerda:0,direita:0};
  for(let y=0;y<5;y++) for(let x=0;x<5;x++){const c=zone[y*5+x];if(!c||zoneIn(x,y)) continue;
    if(y===0) g.alta+=c; else if(y===4) g.baixa+=c; else if(x===0) g.esquerda+=c; else g.direita+=c;}
  return g;
}

      <div class="row" style="margin-top:10px"><button class="btn" data-a="pd-undo" ${S.n?'':'disabled'} style="flex:1">Desfazer último</button><button class="btn" data-a="pd-close" style="flex:1">Encerrar sessão</button></div>`;
  } else h+=`<div class="row" style="margin-top:12px"><button class="btn" data-a="pd-reopen">Reabrir e continuar marcando</button></div>`;

  if(S.n){

  h+=`<h3>Enviar e exportar</h3><div class="row"><button class="btn wa" data-a="wa" data-k="pd" data-r="${s.id}" ${S.n?'':'disabled'}>Enviar por WhatsApp</button><button class="btn" data-a="pd-xlsx" ${S.n?'':'disabled'}>Excel</button><button class="btn" data-a="pd-edit">Editar dados</button><button class="btn danger" data-a="pd-del">Excluir</button></div>`;
  return h;
}

function pdLegendRows(){return [['Legenda',''],[{v:'C ↑ G',s:5},'Verde com G: strike girando (o rebatedor girou; conta strike mesmo fora da zona)'],[{v:'R 5',s:5},'Verde: strike (bola dentro da zona). Tipo + quadro da zona'],[{v:'C ↑',s:6},'Vermelho: fora da zona. Tipo + direção (↑ alta, ↓ baixa, ← esquerda, → direita)'],['Quadros','1 2 3 / 4 5 6 / 7 8 9, da esquerda para a direita e de cima para baixo, visão do receptor'],['Tipos','R reta · C curva · SL slider · S splitter · CH change up']];}
function pdSheets(list){

    const s=list[0],S=pdStats(s),tps=pdTypes(S.by),og=pdOutGroups(S.zone);
    const res=[['Pitcher Data',''],['Atleta',s.name],['Equipe',s.team||''],['Data',fmtDate(s.date)],['Sessão',s.kind||''],['Observação',s.note||''],[],
      ['Total de arremessos',S.n],['Strikes (na zona + girando)',{v:S.st,s:5}],['Bolas (fora da zona, sem giro)',{v:S.b,s:6}],['Strikes girando',{v:S.sw,s:5}],['   dos quais fora da zona',S.swOut],['% strike',pct(S.pct)],[],
      [{v:'Tipo',s:1},{v:'Inicial',s:1},{v:'Qtd.',s:1},{v:'Strikes',s:1},{v:'Bolas',s:1},{v:'% strike',s:1}]];

    res.push([],[{v:'Local fora da zona',s:1},{v:'Qtd.',s:1}],['Alta',{v:og.alta,s:6}],['Baixa',{v:og.baixa,s:6}],['Esquerda (receptor)',{v:og.esquerda,s:6}],['Direita (receptor)',{v:og.direita,s:6}]);
    const seq=[['Arremessos',...Array.from({length:10},(_,i)=>String(i+1))]];
    for(let i=0;i<s.pitches.length;i+=10){
      const ch=s.pitches.slice(i,i+10);
      seq.push([`${i+1} a ${i+ch.length}`,...ch.map(p=>({v:pitchMain(p.pt,p.z[0],p.z[1])+(p.sw?' G':''),s:p.sw?5:zst(p.z[0],p.z[1])}))]);
    }
    seq.push([],...pdLegendRows());
    const map=[['Mapa da zona · visão do receptor','','','','']];
    for(let y=0;y<5;y++){const row=[];for(let x=0;x<5;x++){
      const c=S.zone[y*5+x];const det=tps.map(k=>S.by[k].zone[y*5+x]?PINI[k]+S.by[k].zone[y*5+x]:'').filter(Boolean).join(' ');
      const head=zoneIn(x,y)?'Quadro '+zoneNum(x,y):zoneArrow(x,y)+' fora';
      row.push({v:head+'\n'+c+(c===1?' arremesso':' arremessos')+(det?'\n'+det:''),s:zst(x,y)});}
      map.push(row);}
    const arr=[['Nº','Tipo','Inicial','Zona (1-9 / fora)','Local','Girou','Horário']];
    s.pitches.forEach((p,i)=>{const [x,y]=p.z,zn=zoneNum(x,y),st=p.sw?5:zst(x,y);
      arr.push([i+1,PTYPE[p.pt]||'',{v:PINI[p.pt]||'',s:st},{v:zn!=null?zn:zoneLbl(x,y),s:st},{v:zn!=null?'Strike (na zona)':(p.sw?'Strike girando (fora da zona)':'Fora da zona'),s:st},p.sw?'Sim':'',pdTime(p.t)]);});
    return [{name:'Resumo',rows:res},{name:'Sequência',rows:seq,opt:{colW:[12,8],rowH:26,rowFrom:1}},{name:'Mapa da zona',rows:map,opt:{colW:[17],rowH:62,rowFrom:1}},{name:'Arremessos',rows:arr},{name:'Legenda',rows:pdLegendRows()}];
  }
  const ses=[['Data','Atleta','Equipe','Sessão','Arremessos','Strikes','Bolas','Strikes girando','% strike',...PT_PD.map(k=>PINI[k]+' (qtd.)'),'Observação']];
  const arr=[['Data','Atleta','Equipe','Nº','Tipo','Inicial','Zona (1-9 / fora)','Local','Girou','Horário']];
  list.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.created-b.created).forEach(s=>{
    const S=pdStats(s);
    ses.push([fmtDate(s.date),s.name,s.team||'',s.kind||'',S.n,{v:S.st,s:5},{v:S.b,s:6},S.sw,pct(S.pct),...PT_PD.map(k=>S.by[k]?S.by[k].n:0),s.note||'']);
    s.pitches.forEach((p,i)=>{const [x,y]=p.z,zn=zoneNum(x,y),st=p.sw?5:zst(x,y);
      arr.push([fmtDate(s.date),s.name,s.team||'',i+1,PTYPE[p.pt]||'',{v:PINI[p.pt]||'',s:st},{v:zn!=null?zn:zoneLbl(x,y),s:st},{v:zn!=null?'Strike (na zona)':(p.sw?'Strike girando (fora da zona)':'Fora da zona'),s:st},p.sw?'Sim':'',pdTime(p.t)]);});
  });
  return [{name:'Sessões',rows:ses},{name:'Arremessos',rows:arr},{name:'Legenda',rows:pdLegendRows()}];
}

const DOT=(x,y)=>zoneIn(x,y)?'🟢':'🔴';
function pdText(s){
  const S=pdStats(s),tps=pdTypes(S.by),og=pdOutGroups(S.zone);
  const L=[`⚾ *Pitcher Data* · ${s.name}${s.team?' ('+s.team+')':''}`,`📅 ${fmtDate(s.date)}${s.kind?' · '+s.kind:''}`];
  if(s.note) L.push(`📝 ${s.note}`);
  L.push('',`Arremessos: *${S.n}*`,`🟢 Strikes (na zona + girando): *${S.st}* (${pc(S.pct)})`,`🔴 Bolas (fora, sem giro): *${S.b}*`,...(S.sw?[`🌀 Strikes girando: *${S.sw}* (${S.swOut} fora da zona)`]:[]),'','*Por tipo*');
  tps.forEach(k=>{const b=S.by[k];L.push(`${PINI[k]} ${PTYPE[k]}: ${b.n} · 🟢${b.s} 🔴${b.n-b.s} (${pc(b.s/b.n)} strike)`);});
  const c=n=>String(S.zone[[6,7,8,11,12,13,16,17,18][n-1]]).padStart(3);
  L.push('','*Zona (arremessos por quadro)*','```',` 1:${c(1)} | 2:${c(2)} | 3:${c(3)}`,` 4:${c(4)} | 5:${c(5)} | 6:${c(6)}`,` 7:${c(7)} | 8:${c(8)} | 9:${c(9)}`,'```',
    `Fora: ↑ alta ${og.alta} · ↓ baixa ${og.baixa} · ← ${og.esquerda} · → ${og.direita}`,'','*Sequência*');
  for(let i=0;i<s.pitches.length;i+=10){const ch=s.pitches.slice(i,i+10);L.push(`${i+1}-${i+ch.length}: `+ch.map(p=>((zoneIn(p.z[0],p.z[1])||p.sw)?'🟢':'🔴')+pitchMain(p.pt,p.z[0],p.z[1]).replace(' ','')+(p.sw?'G':'')).join(' '));}
  L.push('','🟢 strike · 🔴 bola · G strike girando · R reta · C curva · SL slider · S splitter · CH change up','_NKC Score_');
  return L.join('\n');
}
function gameText(g){
  const S=replay(g),my=gMyTeam(g),A=aggregate([g]);
  const away=g.home?'opp':'my',home=g.home?'my':'opp';
  const ab={my:(my.abbr||'MEU'),opp:(g.oppAbbr||'ADV')};
  const n=Math.max(g.innings||6,S.inning),pad=(v,w)=>String(v).padStart(w);
  const cell=(side,i)=>{const played=side===away?(i<=S.inning):(i<S.inning||(i===S.inning&&S.half===1));if(!played) return '-';if(g.final&&side===home&&i===S.inning&&S.half===0) return 'X';return S.runs[side][i-1]??0;};
  let ls=' '.repeat(4)+Array.from({length:n},(_,i)=>pad(i+1,3)).join('')+' |  R  H  E';
  for(const side of [away,home]) ls+='\n'+ab[side].slice(0,4).padEnd(4)+Array.from({length:n},(_,i)=>pad(cell(side,i+1),3)).join('')+' |'+pad(S.total[side],3)+pad(S.hits[side],3)+pad(S.errors[side],3);
  const L=[`⚾ *${my.name} ${S.total.my} x ${S.total.opp} ${g.oppName}*`,`📅 ${fmtDate(g.date)}${g.place?' · '+g.place:''} · ${g.final?'Final':'Em andamento ('+(S.half?'▼':'▲')+S.inning+'ª)'}`,'','```\n'+ls+'\n```'];
  const order=[];for(const p of A.plays) if(p.t==='pa'&&p.side==='my'&&p.batter&&!order.includes(p.batter)) order.push(p.batter);
  if(order.length){L.push('',`*Rebatedores · ${my.name}* (H-AB)`);
    for(const k of order){const b=A.bat[k],x=[];
      for(const t of ['2B','3B','HR']) if(b[t]) x.push((b[t]>1?b[t]+' ':'')+t);
      if(b.RBI) x.push(b.RBI+' RBI');if(b.R) x.push(b.R+(b.R>1?' corridas':' corrida'));
      if(b.BB+b.IBB) x.push((b.BB+b.IBB>1?(b.BB+b.IBB)+' ':'')+'BB');if(b.HBP) x.push('HBP');if(b.K) x.push((b.K>1?b.K+' ':'')+'K');if(b.SB) x.push((b.SB>1?b.SB+' ':'')+'SB');
      L.push(`• ${N(k)}: ${b.H}-${b.AB}${x.length?' · '+x.join(', '):''}`);}}
  const pitLine=k=>{const p=A.pit[k],r=pitRates(p);let t=`• ${N(k)}: ${r.IP} IP · ${p.NP} arr. (${pc(r.STRp)} strikes) · ${p.K} K · ${p.BB} BB · ${p.H} H · ${p.R} C`;
    const pz=A.pitches.filter(x=>x.pitcher===k);const ty={};pz.forEach(x=>{if(x.pt) ty[x.pt]=(ty[x.pt]||0)+1;});
    const tk=Object.keys(ty);if(tk.length) t+='\n   Tipos: '+tk.map(q=>`${PINI[q]} ${ty[q]}`).join(' · ');
    const zl=pz.filter(x=>x.zx!=null);if(zl.length){const zi=zl.filter(x=>zoneIn(x.zx,x.zy)).length;t+=`\n   Zona: 🟢${zi} 🔴${zl.length-zi} (${pc(zi/zl.length)} na zona, ${zl.length} com local marcado)`;}
    return t;};
  const isMine=k=>{if(A.myPit.has(k)) return true;if(k.startsWith('m:')){const p=DB.players.find(x=>x.id===k.slice(2));return !!p&&p.teamId===g.myTeamId;}return false;};
  const myP=Object.keys(A.pit).filter(isMine),opP=Object.keys(A.pit).filter(k=>!isMine(k));
  if(myP.length) L.push('',`*Arremessadores · ${my.name}*`,...myP.map(pitLine));
  if(opP.length) L.push('',`*Arremessadores · ${g.oppName}*`,...opP.map(pitLine));
  L.push('','_NKC Score_');
  return L.join('\n');
}

  const s=pdById(ref);return s?{title:`Pitcher Data · ${s.name} (${fmtDate(s.date)})`,text:()=>pdText(s),file:()=>pdFile([s])}:null;
}

function makeFile(kind,scope){

function download(f){
  const a=document.createElement('a');a.href=URL.createObjectURL(f.blob);a.download=f.name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);

async function share(f){
  try{
    const file=new File([f.blob],f.name,{type:f.blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.name});return true;}
  }catch(e){if(e&&e.name==='AbortError') return true;}
  download(f);toast('Compartilhamento indisponível aqui. O arquivo foi baixado.');return false;

  if(t.dataset.f&&UI.form){
    const path=t.dataset.f.split('.');let o=UI.form;
    for(let i=0;i<path.length-1;i++) o=o[path[i]];
    o[path[path.length-1]]=t.value;
    if(t.dataset.f.startsWith('my.')&&t.dataset.f.endsWith('.pid')){
      const p=DB.players.find(x=>x.id===t.value);const i=+path[1];
      if(p&&p.pos&&POS_LIST.includes(p.pos)){UI.form.my[i].pos=p.pos;const s=$('#gf-mypos-'+i);if(s) s.value=p.pos;}
    }
  }
});

  const t=e.target;
  if(t.id==='gf-myteam'&&UI.form){UI.form.myTeamId=t.value;fillMy(UI.form);render();return;}
  if(t.id==='gf-oppteam'&&UI.form){UI.form.oppTeamId=t.value;fillOpp(UI.form);render();return;}

    if(!d||!Array.isArray(d.games)||!Array.isArray(d.players)) return toast('Esse arquivo não é um backup do NKC Score.');
    openSheet(()=>({title:'Restaurar backup',body:`<p>O arquivo tem ${plural(d.players.length,'jogador','jogadores')}, ${plural(d.games.length,'jogo','jogos')} e ${plural((d.pitch||[]).length,'sessão do Pitcher Data','sessões do Pitcher Data')}.</p><p class="small muted"><b>Juntar</b> adiciona o que ainda não existe aqui. <b>Substituir</b> apaga os dados deste aparelho e usa só os do arquivo.</p>`,
      foot:`<button class="btn" data-a="imp-merge">Juntar</button><button class="btn danger" data-a="imp-replace">Substituir</button>`}));
    IMPORT=d;
  };

});

A['imp-merge']=()=>{let d=IMPORT;IMPORT=null;let np=0,ng=0;if((d.v||1)<2) d=migrateDB(Object.assign({},d));
  for(const t of d.teams||[]) if(!DB.teams.some(x=>x.id===t.id)) DB.teams.push(t);
  for(const p of d.players) if(!DB.players.some(x=>x.id===p.id)){DB.players.push(p);np++;}
  for(const g of d.games) if(!DB.games.some(x=>x.id===g.id)){DB.games.push(g);ng++;}
  for(const p of d.pitch||[]) if(!DB.pitch.some(x=>x.id===p.id)) DB.pitch.push(p);
  closeSheet();commit(`Backup juntado: ${plural(np,'jogador','jogadores')} e ${plural(ng,'jogo','jogos')} novos`);};

const WPOS={P:1,C:2,'1B':3,'2B':4,'3B':5,SS:6,LF:7,CF:8,RF:9,DH:'DH',EH:'EH'};
function wPeople(){const m={};(DB.players||[]).forEach(p=>m['m:'+p.id]=p);(DB.games||[]).forEach(g=>(g.oppPlayers||[]).forEach(o=>m['o:'+o.id]=o));return m;}
function wFl(fl){return String(fl||'').split('-').filter(Boolean);}
function wSeq(fl){return wFl(fl).join('');}
function wLoc(ev){const f=fl1(ev.fl);if(f) return f;if(ev.sp&&ev.sp.length===2) return String(nearestPos(ev.sp[0],ev.sp[1]));return '';}

function wBatSym(ev,reached){
  const fl=ev.fl||'',seq=wSeq(fl),f1=fl1(fl),e0=(ev.errs||[])[0];
  switch(ev.res){
    case '1B':case '2B':case '3B':return wLoc(ev);
    case 'HR':return 'HR'+wLoc(ev);
    case 'BB':return 'BB';case 'IBB':return 'IBB';case 'HBP':return 'HP';case 'CI':return 'IO';
    case 'K':return 'KS';case 'KL':return 'KL';
    case 'K3':return reached?('KS'+(e0?' E'+e0:'')):('KS'+(seq?' '+seq:''));
    case 'SF':return 'SF'+f1;
    case 'SH':return 'SH'+(seq?' '+seq:'')+(reached&&e0?' E'+e0:'');
    case 'FC':return 'FC'+f1;
    case 'E':return 'E'+(e0||f1);
    case 'DP':case 'TP':return seq||ev.res;
    case 'OUT':{
      if(ev.ht==='F'||ev.ht==='L'||ev.ht==='P') return ev.ht+(f1||'');
      if(!seq) return ev.ht==='B'?'B':'OUT';

    }
  }

}
function wAddDef(D,fs,fl,outs,kind){
  const f=wFl(fl).map(Number).filter(n=>n>=1&&n<=9);
  if(!f.length) return;
  const last=f[f.length-1];
  const add=(pos,k,n)=>{D[fs].pos[pos]=D[fs].pos[pos]||{PO:0,A:0,E:0,DP:0};D[fs].pos[pos][k]+=n||1;D[fs].tot[k]+=n||1;};
  if(kind==='air'||f.length===1){add(last,'PO');}
  else{
    new Set(f.slice(0,-1)).forEach(p=>add(p,'A'));
    add(last,'PO');

}
