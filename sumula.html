<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>NKC Score</title>
<meta name="description" content="NKC Score: súmula de beisebol offline, marcação arremesso a arremesso, estatísticas e exportação para Excel.">
<meta name="theme-color" content="#0B1310">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NKC Score">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: coluna única para celular; faixa de placar de estádio no topo, campo verde como acento, tinta de súmula abaixo */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#E1E8E1; --ink:#121C16; --muted:#55655B; --line:#C8D2C9;
  --accent:#1C6943; --accent-ink:#FFFFFF; --accent-soft:#D3E7D9;
  --ball:#1C6943; --strike:#B4771C; --out:#B5382D; --danger:#B5382D;
  --field:#CFE2D2; --dirt:#E2CCB4; --chalk:#FFFFFF;
  --board:#0B1310; --board-2:#16231C; --board-ink:#EEF3EC; --board-muted:#8FA397; --led:#F2B544; --led-b:#43B97E; --led-o:#E5574B;
  --shadow:rgba(8,16,12,.28);
  --f-display:"Roboto Condensed","Arial Narrow","Helvetica Neue",sans-serif-condensed,system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"Roboto Mono","SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1310; --surface:#151F1A; --surface-2:#1E2A24; --ink:#E4ECE6; --muted:#93A399; --line:#2B3932;
  --accent:#4DBA85; --accent-ink:#06120C; --accent-soft:#183326;
  --ball:#4DBA85; --strike:#E0A447; --out:#EC6A5E; --danger:#EC6A5E;
  --field:#1B3124; --dirt:#4A3A2B; --chalk:#D9E3DB; --shadow:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1310; --surface:#151F1A; --surface-2:#1E2A24; --ink:#E4ECE6; --muted:#93A399; --line:#2B3932;
  --accent:#4DBA85; --accent-ink:#06120C; --accent-soft:#183326;
  --ball:#4DBA85; --strike:#E0A447; --out:#EC6A5E; --danger:#EC6A5E;
  --field:#1B3124; --dirt:#4A3A2B; --chalk:#D9E3DB; --shadow:rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
[hidden]{display:none!important}
img,svg{max-width:100%}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(92px + env(safe-area-inset-bottom,0px))}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 12px}
.brand{font:700 15px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.brand svg{width:22px;height:22px;color:var(--accent)}
.pill{font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--accent-soft);color:var(--accent)}
h2{font:700 24px/1.15 var(--f-display);letter-spacing:.02em;margin:2px 0 10px;text-wrap:balance}
h3{font:700 12px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
p{margin:0 0 10px;max-width:65ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* placar */
.board{background:var(--board);border:1px solid var(--board-2);color:var(--board-ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--board-muted)}
.board-head span:last-child{white-space:nowrap}
.board-head span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-main{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center}
.teams{display:flex;flex-direction:column;gap:5px}
.team{display:flex;align-items:center;gap:10px;font:700 24px/1 var(--f-display);letter-spacing:.05em}
.team .ab{min-width:3.2ch}
.team .r{font-family:var(--f-mono);color:var(--led);font-weight:700}
.team i{width:7px;height:7px;border-radius:50%;background:transparent;flex:none}
.team.bat i{background:var(--led)}
.inning{font:700 34px/1 var(--f-display);text-align:center;color:var(--board-ink)}
.inning small{display:block;font:600 10px/1.4 var(--f-body);color:var(--board-muted);letter-spacing:.1em;text-transform:uppercase}
.count{display:flex;flex-direction:column;gap:6px;font:700 12px/1 var(--f-mono);color:var(--board-muted)}
.count span{display:flex;align-items:center;gap:5px}
.count b{width:12px}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--board-muted);display:inline-block}
.dot.b.on{background:var(--led-b);border-color:var(--led-b)}
.dot.s.on{background:var(--led);border-color:var(--led)}
.dot.o.on{background:var(--led-o);border-color:var(--led-o)}
.ls{overflow-x:auto;border-top:1px solid var(--board-2);padding-top:6px}
.ls table{border-collapse:collapse;font:500 12px/1 var(--f-mono);color:var(--board-muted);width:100%}
.ls th,.ls td{padding:4px 4px;text-align:center;min-width:20px;font-weight:500}
.ls th{font-size:10px}
.ls td:first-child,.ls th:first-child{text-align:left;color:var(--board-ink);font-family:var(--f-display);letter-spacing:.05em}
.ls .cur{color:var(--led)}
.ls .tot{color:var(--board-ink);font-weight:700}
.ls .sep{border-left:1px solid var(--board-2)}

/* duelo */
.matchup{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:12px;align-items:center}
.who{display:flex;flex-direction:column;gap:3px;min-width:0}
.lbl{font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.who .nm{font:700 21px/1.1 var(--f-display);overflow-wrap:anywhere}
.who .sub{font-size:13px;color:var(--muted)}
.who hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.diamond{width:100%;height:auto;display:block}
.diamond g[data-a]{cursor:pointer}

/* botões */
button{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;cursor:pointer;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.pbtn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible,.zone button:focus-visible,.list-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:active,.pbtn:active,.chip:active{transform:translateY(1px)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pbtn{border:1px solid var(--line);border-radius:12px;min-height:66px;font:700 16px/1.1 var(--f-display);letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--surface);color:var(--ink);padding:6px}
.pbtn small{font:600 11px/1 var(--f-mono);color:var(--muted)}
.pbtn.ball{box-shadow:inset 0 -4px 0 var(--ball)}
.pbtn.strike{box-shadow:inset 0 -4px 0 var(--strike)}
.pbtn.play{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pbtn.play small{color:inherit;opacity:.8}
.pbtn[disabled]{opacity:.4}
.pad2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad2 .btn{padding:8px 4px;font-size:13px}

details.pdet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
details.pdet summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.pdet summary::after{content:"+";color:var(--muted);font-family:var(--f-mono)}
details.pdet[open] summary::after{content:"−"}
details.pdet .in{padding-bottom:12px;display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:start}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font-weight:600;font-size:14px;min-height:38px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.out.on{background:var(--danger);border-color:var(--danger);color:#fff}
.chip.sm{padding:5px 10px;min-height:34px;font-size:13px}

.zone{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:100%;max-width:220px;aspect-ratio:1/1.15;margin:0 auto}
.zone button{border:1px dashed var(--line);background:transparent;border-radius:4px;min-height:0;cursor:pointer;padding:0;font:600 11px var(--f-mono);color:var(--muted)}
.zone button.in{border:1px solid var(--muted);background:var(--surface-2)}
.zone button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.zone-cap{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}

.log{display:flex;flex-direction:column}
.log-item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink)}
.log-item .nt{font:700 14px/1.2 var(--f-mono);overflow-wrap:anywhere}
.log-item .ds{min-width:0;font-size:14px}
.log-item .ds small{display:block;color:var(--muted);font-size:12px}
.log-item .rs{font:700 12px var(--f-mono);color:var(--accent);white-space:nowrap}
.log-item .nb{display:block;font-size:12px;color:var(--strike);margin-top:2px}
.inn-h{font:700 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px}
button.log-item{cursor:pointer}

.fl-display{font:700 22px/1 var(--f-mono);padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:46px;display:flex;align-items:center}
.fl-display.empty{font:400 14px var(--f-body);color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.keys button{min-height:46px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:700 16px/1 var(--f-mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.keys button small{font:600 10px var(--f-body);color:var(--muted)}

.mv-row{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.mv-row .who2{font-size:14px;font-weight:600}
.mv-row .who2 span{color:var(--muted);font-weight:500}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;width:44px;height:42px;font:700 18px var(--f-mono);cursor:pointer;color:var(--ink)}
.stepper output{min-width:34px;text-align:center;font:700 16px var(--f-mono)}

.field{width:100%;height:auto;display:block;max-width:420px;margin:0 auto;touch-action:manipulation}
.field.pick{cursor:crosshair}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);justify-content:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* folha inferior */
.backdrop{position:fixed;inset:0;background:var(--shadow);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:16px 16px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;box-shadow:0 -10px 34px var(--shadow);max-width:640px;margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:14px;padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head h2{margin:0;font-size:20px}
.sheet-body{overflow:auto;padding-top:2px;padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overscroll-behavior:contain}
.sheet-foot{display:flex;gap:8px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .btn{flex:1}
.sheet-err{color:var(--danger);font-weight:600;font-size:14px;margin-top:10px}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--ink)}

/* navegação */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px/1 var(--f-body);color:var(--muted);min-height:54px;cursor:pointer}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* tabelas */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font:700 11px/1 var(--f-body);letter-spacing:.05em;color:var(--muted);text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--f-mono);font-size:13px}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-family:var(--f-body)}
.tbl tr.tot td{font-weight:700;background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.foot-note{font-size:12px;color:var(--muted);margin-top:6px}

/* formulários */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;flex:1 1 140px;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:9px 14px;font-weight:600;min-height:42px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg.nowrap{flex-wrap:nowrap}
.seg.nowrap button{white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.lu-row{display:grid;grid-template-columns:26px minmax(0,1fr) 86px;gap:6px;align-items:center;margin-bottom:6px}
.lu-row.opp{grid-template-columns:26px 72px minmax(0,1fr)}
.lu-row .n{font:700 14px var(--f-mono);color:var(--muted);text-align:right}

.list-btn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;color:var(--ink)}
.list-btn.game{grid-template-columns:auto minmax(0,1fr) auto}
.crest{width:30px;height:30px;border-radius:7px;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden;border:1px solid var(--line)}
.board .crest{border-color:var(--board-2)}
.crest img{width:100%;height:100%;object-fit:contain;padding:2px;display:block}
.crest b{font:700 15px/1 var(--f-display);color:#18221D}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
.vs-side{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.vs-side label.f{flex:none;width:100%}
.stack>label.f,.card>label.f,.sheet-body>label.f{flex:none}
.vs-x{font:700 20px/1 var(--f-display);color:var(--muted);padding-bottom:12px}
.team-head{display:flex;gap:12px;align-items:flex-start}
@media (max-width:420px){.vs{grid-template-columns:1fr}.vs-x{display:none}}
.list-btn .t{font:700 17px/1.2 var(--f-display);letter-spacing:.02em}
.list-btn .s{font-size:13px;color:var(--muted)}
.list-btn .sc{font:700 20px/1 var(--f-mono);text-align:right}
.res{font:700 11px var(--f-body);letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.res.v{background:var(--accent-soft);color:var(--accent)}
.res.d{color:var(--out)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px var(--shadow);font-size:14px}
.note{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.warn{border:1px solid var(--strike);border-radius:var(--r);padding:10px 12px;font-size:13px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent)}
.bar .v{font-family:var(--f-mono);text-align:right;font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:260px;margin:0 auto;aspect-ratio:1/1.15}
.heat div{border-radius:4px;display:flex;align-items:center;justify-content:center;font:700 12px var(--f-mono);border:1px dashed var(--line)}
.heat div.in{border:1px solid var(--muted)}
@media (max-width:380px){.matchup{grid-template-columns:minmax(0,1fr) 108px}.pbtn{font-size:15px}.team{font-size:21px}.inning{font-size:28px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="appbar">
    <a class="brand" href="index.html" style="color:inherit;text-decoration:none" aria-label="Voltar ao menu NKC Score"><span aria-hidden="true" style="color:var(--muted)">‹</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/><path d="M12 8l4 4-4 4-4-4z" fill="currentColor" stroke="none"/></svg>NKC Score</a>
    <span class="pill" id="status-pill">Offline</span>
  </header>
  <main id="view"></main>

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function blankDB(){return {v:2,teams:[],myTeamId:null,team:{name:'Meu Time',abbr:'MEU'},players:[],games:[],currentGameId:null,lastBackup:null}}
function nameParts(off){
  const [sur,giv]=String(off).split(',').map(s=>(s||'').trim());
  const tc=s=>s.toLocaleLowerCase('pt-BR').replace(/(^|[\s'-])(\p{L})/gu,(m,a,b)=>a+b.toLocaleUpperCase('pt-BR'));
  const g=(giv||'').split(/\s+/).filter(Boolean);
  return {first:g[0]||'',second:g[1]||'',sur:tc(sur||'')};
}
function seedDB(){
  const db=blankDB();
  db.myTeamId='NKC';
  for(const [code,[name,list]] of Object.entries(SEED_CLUBS)){
    db.teams.push({id:code,name,abbr:code,logo:code});
    const parts=list.map(([w,off])=>Object.assign({w,off},nameParts(off)));
    const cnt={};parts.forEach(p=>{const k=p.first+' '+p.sur;cnt[k]=(cnt[k]||0)+1;});
    parts.forEach(p=>{const k=p.first+' '+p.sur;const nm=(cnt[k]>1&&p.second)?p.first+' '+p.second+' '+p.sur:k;
      db.players.push({id:'w'+p.w,name:nm.trim(),full:p.off,num:'',pos:'',bats:'',thr:'',teamId:code,wbsc:p.w});});
  }
  return db;
}
function migrateDB(d){
  if(!d) return seedDB();
  if((d.v||1)>=2) return d;
  const onlyDemo=!d.games.some(g=>!g.demo)&&!d.players.some(p=>!p.demo);
  const s=seedDB();
  if(onlyDemo){s.lastBackup=d.lastBackup||null;return s;}
  const leg={id:'LEG',name:(d.team&&d.team.name)||'Meu Time',abbr:((d.team&&d.team.abbr)||'MEU').slice(0,4),logo:null};
  d.players.forEach(p=>{p.teamId='LEG';});
  d.games.forEach(g=>{g.myTeamId='LEG';});
  s.teams.unshift(leg);
  s.players=d.players.concat(s.players);
  s.games=d.games;s.currentGameId=d.currentGameId;s.lastBackup=d.lastBackup||null;
  return s;
}
function baseLbl(b){return ['out','1ª','2ª','3ª','casa'][b]}
function fl1(fl){return String(fl||'').split('-')[0]||''}

function forcedMoves(bases){
  const m={B:1};
  if(bases[0]){m['1']=2; if(bases[1]){m['2']=3; if(bases[2]) m['3']=4;}}
  return m;
}
function defaultMoves(res,bases){
  const on=b=>!!bases[b-1];
  let m={};
  const adv=n=>{for(const b of [3,2,1]) if(on(b)) m[String(b)]=Math.min(4,b+n);};
  const lead=()=>on(1)?1:(on(2)?2:(on(3)?3:0));
  switch(res){
    case 'BB':case 'IBB':case 'HBP':case 'CI':case 'E':case 'K3': m=forcedMoves(bases); break;
    case '1B': m.B=1; adv(1); break;
    case '2B': m.B=2; adv(2); break;
    case '3B': m.B=3; adv(4); break;
    case 'HR': m.B=4; adv(4); break;
    case 'SF': m.B=0; if(on(3)) m['3']=4; break;
    case 'SH': m.B=0; adv(1); break;
    case 'DP': {m.B=0; const l=lead(); if(l) m[String(l)]=0; break;}
    case 'TP': {m.B=0; let n=0; for(const b of [1,2,3]) if(on(b)&&n<2){m[String(b)]=0;n++;} break;}
    case 'FC': {m.B=1; const l=lead(); if(l) m[String(l)]=0; break;}
    default: m.B=0;
  }
  for(const b of [1,2,3]) if(on(b)&&m[String(b)]===undefined) m[String(b)]=b;
  return m;
}
function runsIn(m){return Object.values(m).filter(v=>v===4).length}
function defaultRbi(res,m){return ['E','DP','TP','K3','K','KL'].includes(res)?0:runsIn(m)}

function notation(ev){
  if(!ev||ev.t!=='pa') return '';
  const fl=ev.fl||'', f1=fl1(fl);
  switch(ev.res){
    case '1B':case '2B':case '3B':case 'HR': return ev.res+(f1?'('+f1+')':'');
    case 'OUT':{
      if(ev.ht==='F'||ev.ht==='L'||ev.ht==='P') return ev.ht+(f1||'');
      if(!fl) return 'OUT';
      const n=fl.split('-').length;
      if(ev.ht==='G'||ev.ht==='B') return (ev.ht==='B'?'B':'')+(n===1?fl+'U':fl);
      return fl;
    }
    case 'SF': return 'SF'+f1;
    case 'SH': return 'SH'+(fl?' '+fl:'');
    case 'DP': return 'DP'+(fl?' '+fl:'');
    case 'TP': return 'TP'+(fl?' '+fl:'');
    case 'FC': return 'FC'+f1;
    case 'E': return 'E'+(f1||((ev.errs&&ev.errs[0])||''));
    case 'K3': return 'K'+(fl?' '+fl:'')+'*';
    default: return ev.res;
  }
}

  const S={inning:1,half:0,outs:0,balls:0,strikes:0,bases:[null,null,null],
    slot:{my:0,opp:0},
    lineup:{my:(g.my.lineup||[]).map(x=>'m:'+x.pid),opp:g.opp.keys?g.opp.keys.slice():(g.opp.lineup||[]).map(id=>'o:'+id)},
    pitcher:{my:'m:'+g.my.pitcher,opp:g.opp.pKey||'o:'+g.opp.pitcher},
    runs:{my:[0],opp:[0]},hits:{my:0,opp:0},errors:{my:0,opp:0},lob:{my:0,opp:0},
    seq:[],plays:[],pitches:[],np:{}};
  const bs=()=>battingSide(g,S.half);
  const fs=()=>bs()==='my'?'opp':'my';
  const ensure=()=>{for(const s of ['my','opp']) while(S.runs[s].length<S.inning) S.runs[s].push(0);};
  const total=s=>S.runs[s].reduce((a,b)=>a+b,0);
  const endHalf=()=>{S.lob[bs()]+=S.bases.filter(Boolean).length;S.bases=[null,null,null];S.outs=0;S.balls=0;S.strikes=0;S.seq=[];
    if(S.half===0) S.half=1; else {S.half=0;S.inning++;} ensure();};
  const countPitch=(r,pt,z,batter,pitcher)=>{
    S.np[pitcher]=(S.np[pitcher]||0)+1;
    S.pitches.push({gid:g.id,inning:S.inning,half:S.half,batter,pitcher,n:S.seq.length+1,r,pt:pt||'',zx:z?z[0]:null,zy:z?z[1]:null,balls:S.balls,strikes:S.strikes});
    S.seq.push(r);
  };
  const applyMoves=(mv,batterRunner,play)=>{
    const nb=[null,null,null];let outs=0,runs=0;const scorers=[],charged={};
    const b0=S.bases.slice();
    const place=(runner,to)=>{
      if(to===0){outs++;return;}
      if(to===4){runs++;scorers.push(runner.key);charged[runner.resp]=(charged[runner.resp]||0)+1;return;}
      nb[to-1]=runner;
    };
    for(const b of [3,2,1]){const r=b0[b-1]; if(!r) continue; const t=mv[String(b)]!==undefined?mv[String(b)]:b; place(r,t);}
    if(batterRunner&&mv.B!==undefined) place(batterRunner,mv.B);
    S.bases=nb;S.outs+=outs;ensure();S.runs[bs()][S.inning-1]+=runs;
    play.runs=runs;play.outsOnPlay=outs;play.scorers=scorers;play.charged=charged;
  };

    ensure();
    const side=bs(),fside=fs();
    const lu=S.lineup[side];
    const batter=lu.length?lu[S.slot[side]%lu.length]:null;
    const pitcher=S.pitcher[fside];
    if(ev.t==='pitch'){
      countPitch(ev.r,ev.pt,ev.z,batter,pitcher);
      if(ev.r==='B') S.balls=Math.min(3,S.balls+1);
      else if(ev.r==='C'||ev.r==='S') S.strikes=Math.min(2,S.strikes+1);
      else if(ev.r==='F'&&S.strikes<2) S.strikes++;
      return;
    }
    if(ev.t==='sub'){
      const prev=ev.role==='P'?S.pitcher[ev.side]:S.lineup[ev.side][ev.slot];
      if(ev.role==='P') S.pitcher[ev.side]=ev.key; else S.lineup[ev.side][ev.slot]=ev.key;
      S.plays.push({i,t:'sub',gid:g.id,inning:S.inning,half:S.half,side:ev.side,role:ev.role,key:ev.key,prev,slot:ev.slot,note:ev.note||'',
        scoreAfter:{my:total('my'),opp:total('opp')}});
      return;
    }
    const snap={i,t:ev.t,gid:g.id,inning:S.inning,half:S.half,side,fside,batter,pitcher,outsBefore:S.outs,
      basesBefore:S.bases.map(r=>r?r.key:null),scoreBefore:{my:total('my'),opp:total('opp')},note:ev.note||''};
    if(ev.t==='pa'){
      snap.count=S.balls+'-'+S.strikes;
      if(ev.res!=='IBB'&&ev.last) countPitch(ev.last.r,ev.last.pt,ev.last.z,batter,pitcher);
      snap.seq=S.seq.join(' ');snap.np=S.seq.length;snap.res=ev.res;snap.not=notation(ev);
      snap.ht=ev.ht||'';snap.sp=ev.sp||null;snap.fl=ev.fl||'';snap.rbi=ev.rbi||0;snap.errs=ev.errs||[];
      applyMoves(ev.mv||{},{key:batter,resp:pitcher},snap);
      S.errors[fside]+=(ev.errs||[]).length;
      if(RES[ev.res]&&RES[ev.res].hit) S.hits[side]++;
      snap.scoreAfter={my:total('my'),opp:total('opp')};
      S.plays.push(snap);
      S.slot[side]=(S.slot[side]+1)%Math.max(1,lu.length);
      S.balls=0;S.strikes=0;S.seq=[];
      if(S.outs>=3) endHalf();
      return;
    }
    if(ev.t==='run'){
      snap.kind=ev.k;snap.errs=ev.errs||[];
      snap.movers=[];
      for(const b of [1,2,3]){const r=snap.basesBefore[b-1];const to=(ev.mv||{})[String(b)];if(r&&to!==undefined&&to!==b) snap.movers.push({key:r,from:b,to});}
      applyMoves(ev.mv||{},null,snap);
      S.errors[fside]+=(ev.errs||[]).length;
      snap.not=ev.k;snap.scoreAfter={my:total('my'),opp:total('opp')};
      S.plays.push(snap);
      if(S.outs>=3) endHalf();
    }
  });
  ensure();
  S.total={my:total('my'),opp:total('opp')};
  return S;
}

function simPA(g,res,o){
  o=o||{};
  const S=replay(g);
  const mv=Object.assign(defaultMoves(res,S.bases),o.mv||{});
  const ev={t:'pa',res,mv,rbi:o.rbi!=null?o.rbi:defaultRbi(res,mv),ht:o.ht||null,sp:o.sp||null,fl:o.fl||'',
    errs:o.errs||(res==='E'&&o.fl?[fl1(o.fl)]:[]),note:o.note||'',last:o.last!==undefined?o.last:(res==='IBB'?null:{r:'X'})};
  g.events.push(ev);
  return ev;
}
function simPitch(g,r,meta){
  meta=meta||{};
  const S=replay(g);
  if(r==='B'&&S.balls===3) return simPA(g,'BB',{last:Object.assign({r:'B'},meta)});
  if((r==='C'||r==='S')&&S.strikes===2) return simPA(g,r==='C'?'KL':'K',{last:Object.assign({r},meta)});
  const ev=Object.assign({t:'pitch',r},meta);
  g.events.push(ev);
  return ev;
}

function makeNamer(db){
  const m={};
  (db.players||[]).forEach(p=>m['m:'+p.id]=p);
  (db.games||[]).forEach(g=>(g.oppPlayers||[]).forEach(o=>m['o:'+o.id]=o));
  return (key,short)=>{
    if(!key) return '—';
    const p=m[key]; if(!p) return '(removido)';
    const n=short?String(p.name||'').split(' ')[0]:p.name;
    return (p.num?'#'+p.num+' ':'')+(n||'');
  };
}
function dirOf(sp){
  if(!sp) return '';
  const a=Math.atan2(sp[0]-150,262-sp[1])*180/Math.PI;
  return a<-15?'Esquerda':(a>15?'Direita':'Centro');
}
function nearestPos(x,y){
  let best=1,bd=1e9;
  for(const k in FPOS){const [px,py]=FPOS[k]; if(k==='2'&&y<240) continue; const d=(px-x)**2+(py-y)**2; if(d<bd){bd=d;best=+k;}}
  return best;
}

function aggregate(games){
  const bat={},pit={},plays=[],pitches=[],myBat=new Set(),myPit=new Set();
  const B=k=>bat[k]||(bat[k]={key:k,G:new Set(),PA:0,AB:0,H:0,'1B':0,'2B':0,'3B':0,HR:0,R:0,RBI:0,BB:0,IBB:0,HBP:0,K:0,SF:0,SH:0,SB:0,CS:0,GDP:0,ROE:0,TB:0});
  const P=k=>pit[k]||(pit[k]={key:k,G:new Set(),BF:0,OUTS:0,NP:0,STR:0,FP:0,FPS:0,H:0,R:0,BB:0,HBP:0,K:0,HR:0,GB:0,AIR:0});
  const states={};
  for(const g of games){
    const S=replay(g); states[g.id]=S;
    for(const pc of S.pitches){
      pitches.push(pc);
      if(!pc.pitcher) continue;
      const p=P(pc.pitcher); p.G.add(g.id); p.NP++;
      const isStr='CSFX'.includes(pc.r);
      if(isStr) p.STR++;
      if(pc.n===1){p.FP++; if(isStr) p.FPS++;}
    }
    for(const pl of S.plays){
      plays.push(pl);
      if(pl.t==='sub') continue;
      if(pl.batter&&pl.side==='my') myBat.add(pl.batter);
      if(pl.pitcher&&pl.fside==='my') myPit.add(pl.pitcher);
      if(pl.pitcher){const p=P(pl.pitcher); p.G.add(g.id); p.OUTS+=pl.outsOnPlay||0;}
      for(const k of pl.scorers||[]) B(k).R++;
      for(const k in pl.charged||{}) P(k).R+=pl.charged[k];
      if(pl.t==='pa'&&pl.batter){
        const b=B(pl.batter),r=RES[pl.res]||{};
        b.G.add(g.id); b.PA++;
        if(r.ab) b.AB++;
        if(r.hit){b.H++; b[pl.res]++; b.TB+=r.tb;}
        if(pl.res==='BB') b.BB++;
        if(pl.res==='IBB') b.IBB++;
        if(pl.res==='HBP') b.HBP++;
        if(r.k) b.K++;
        if(pl.res==='SF') b.SF++;
        if(pl.res==='SH') b.SH++;
        if(pl.res==='DP') b.GDP++;
        if(pl.res==='E') b.ROE++;
        b.RBI+=pl.rbi||0;
        if(pl.pitcher){
          const p=P(pl.pitcher); p.BF++;
          if(r.hit) p.H++;
          if(pl.res==='HR') p.HR++;
          if(pl.res==='BB'||pl.res==='IBB') p.BB++;
          if(pl.res==='HBP') p.HBP++;
          if(r.k) p.K++;
          if(pl.ht==='G'||pl.ht==='B') p.GB++;
          if(pl.ht==='F'||pl.ht==='L'||pl.ht==='P') p.AIR++;
        }
      }
      if(pl.t==='run'){
        for(const m of pl.movers||[]){
          if(pl.kind==='SB'&&m.to>m.from) B(m.key).SB++;
          if(pl.kind==='CS'&&m.to===0) B(m.key).CS++;
        }
      }
    }
  }
  return {bat,pit,plays,pitches,states,myBat,myPit};
}
function batRates(s){
  const AVG=s.AB?s.H/s.AB:null;
  const od=s.AB+s.BB+s.IBB+s.HBP+s.SF;
  const OBP=od?(s.H+s.BB+s.IBB+s.HBP)/od:null;
  const SLG=s.AB?s.TB/s.AB:null;
  const OPS=(OBP!=null&&SLG!=null)?OBP+SLG:null;
  return {AVG,OBP,SLG,OPS,Kp:s.PA?s.K/s.PA:null,BBp:s.PA?(s.BB+s.IBB)/s.PA:null};
}
function pitRates(p){
  const ip=p.OUTS/3;
  return {IP:Math.floor(p.OUTS/3)+'.'+(p.OUTS%3),ipN:ip,WHIP:ip?(p.H+p.BB)/ip:null,RA9:ip?p.R*9/ip:null,
    STRp:p.NP?p.STR/p.NP:null,FPSp:p.FP?p.FPS/p.FP:null,Kp:p.BF?p.K/p.BF:null,BBp:p.BF?p.BB/p.BF:null};
}
function splitOf(plays){
  const s={PA:0,AB:0,H:0,TB:0,BB:0,HBP:0,SF:0,K:0};
  for(const p of plays){const r=RES[p.res]||{}; s.PA++; if(r.ab) s.AB++; if(r.hit){s.H++;s.TB+=r.tb;} if(p.res==='BB'||p.res==='IBB') s.BB++; if(p.res==='HBP') s.HBP++; if(p.res==='SF') s.SF++; if(r.k) s.K++;}
  const od=s.AB+s.BB+s.HBP+s.SF;
  s.AVG=s.AB?s.H/s.AB:null; s.OBP=od?(s.H+s.BB+s.HBP)/od:null; s.SLG=s.AB?s.TB/s.AB:null;
  s.Kp=s.PA?s.K/s.PA:null; s.BBp=s.PA?s.BB/s.PA:null;
  return s;
}
const SPLITS=[

function buildSheets(db,games){
  const N=makeNamer(db);

    } else {

    }
  }
  const pitchRows=[['Data','Adversário','Entrada','Metade','Rebatedor','Arremessador','Nº na vez','Contagem antes','Resultado','Tipo','Zona coluna (1-5)','Zona linha (1-5)','Dentro da zona']];
  for(const pc of A.pitches){
    const g=gById[pc.gid];
    const hasZ=pc.zx!=null;
    const inZ=hasZ?(pc.zx>=1&&pc.zx<=3&&pc.zy>=1&&pc.zy<=3?'Sim':'Não'):'';
    pitchRows.push([g.date,g.oppName,pc.inning,half(pc.half),N(pc.batter),N(pc.pitcher),pc.n,pc.balls+'-'+pc.strikes,PITCH[pc.r]||pc.r,PTYPE[pc.pt]||'',hasZ?pc.zx+1:'',hasZ?pc.zy+1:'',inZ]);

  const isMy=(set,k)=>set.has(k)?0:1;
  const bl=Object.values(A.bat).sort((a,b)=>isMy(A.myBat,a.key)-isMy(A.myBat,b.key)||b.PA-a.PA);

  }
  const splitRows=[['Situação','PA','AB','H','BB+HBP','K','AVG','OBP','SLG','K%','BB%']];
  const myPA=A.plays.filter(p=>p.t==='pa'&&p.side==='my');

  const legend=[['Sigla','Significado'],
    ['J','Jogos'],['PA','Aparições no bastão (todas as vezes que foi rebater)'],['AB','Vezes oficiais ao bastão (exclui BB, IBB, HBP, SF, SH, interferência)'],
    ['R','Corridas anotadas'],['H','Rebatidas válidas'],['1B / 2B / 3B / HR','Simples / dupla / tripla / home run'],['RBI','Corridas impulsionadas (sugestão automática, editável na marcação)'],
    ['BB / IBB','Base por bolas / base intencional'],['HBP','Atingido pelo arremesso'],['K','Strikeouts (girando, olhando e 3º strike solto)'],['SB / CS','Bases roubadas / pego roubando'],
    ['SF / SH','Fly de sacrifício / bunt de sacrifício'],['GIDP','Queimada dupla rebatendo'],['ROE','Chegou na base por erro'],['TB','Total de bases'],
    ['AVG','Média de rebatidas = H / AB'],['OBP','% em base = (H+BB+IBB+HBP) / (AB+BB+IBB+HBP+SF)'],['SLG','Slugging = TB / AB'],['OPS','OBP + SLG'],
    ['IP','Entradas arremessadas (x.1 = 1 out, x.2 = 2 outs)'],['BF','Rebatedores enfrentados'],['WHIP','(H + BB) / IP'],
    ['C/9','Todas as corridas permitidas por 9 entradas. Não é ERA: o app não separa corridas limpas e sujas.'],
    ['Strike %','Strikes (olhando, girando, falta e bola em jogo) / total de arremessos'],['1º arremesso strike %','Vezes em que o 1º arremesso da vez foi strike'],
    ['Notação defensiva','1 P, 2 C, 3 1B, 4 2B, 5 3B, 6 SS, 7 LF, 8 CF, 9 RF. Ex.: 6-3 = SS para 1B; F8 = fly no CF; L6 = linha no SS; P4 = pop no 2B; 3U = sem assistência; K* = 3º strike solto'],
    ['Spray X / Y','Ponto no desenho do campo (home = 150, 262; linhas de foul a 45°)'],
    ['Zona','Grade 5x5 vista do receptor; colunas e linhas 2 a 4 formam a zona de strike']];
  return [
    {name:'Jogos',rows:gameRows},
    {name:'Jogadas',rows:playRows},
    {name:'Arremessos',rows:pitchRows},
    {name:'Rebatedores',rows:batRows},
    {name:'Arremessadores',rows:pitRows},
    {name:'Situações',rows:splitRows},
    {name:'Legenda',rows:legend}
  ];
}

function csvText(rows){
  const cell=c=>{
    let v=(c&&typeof c==='object')?c.v:c;
    if(v==null) return '';
    if(typeof v==='number') return String(v).replace('.',',');
    v=String(v);

  };
  return '﻿'+rows.map(r=>r.map(cell).join(';')).join('\r\n');
}

      <div><div class="zone">${zbtns.join('')}</div><div class="zone-cap">Visão do receptor</div></div>
    </div></details>`;
  h+=`<div class="pad" style="margin-top:12px">
    <button class="pbtn ball" data-a="pitch" data-r="B">Bola<small>B · ${S.balls===3?'vira BB':'bola '+(S.balls+1)}</small></button>

    <button class="pbtn strike" data-a="pitch" data-r="F">Falta<small>F</small></button>

  h+=`<h3>Últimas jogadas</h3><div class="log">${recent.length?recent.map(p=>logItem(p,true)).join(''):'<p class="muted small">Ainda não há jogadas. Comece pelo primeiro arremesso.</p>'}</div>`;
  h+=`<div class="row" style="margin-top:16px"><button class="btn ghost" data-a="open-game" data-id="${g.id}">Jogo completo</button><button class="btn ghost" data-a="wake">${UI.wake?'Tela acesa ✓':'Manter tela acesa'}</button><button class="btn ghost danger" data-a="end-game">Encerrar jogo</button></div>`;
  return h;
}

function chip(a,v,l,on,extra){return `<button class="chip${on?' on':''}${extra?' '+extra:''}" data-a="${a}" data-v="${v}">${l}</button>`;}
function moveRows(S,mv,withBatter,act,batterKey){
  const rows=[];
  const who=[...[3,2,1].filter(b=>S.bases[b-1]).map(String),...(withBatter?['B']:[])];
  for(const w of who){
    const from=w==='B'?0:+w;
    const key=w==='B'?batterKey:S.bases[from-1].key;
    const label=w==='B'?'Rebatedor':`Corredor na ${from}ª`;
    const cur=mv[w]!==undefined?mv[w]:(w==='B'?undefined:from);
    let opts=`<button class="chip sm out${cur===0?' on':''}" data-a="${act}" data-w="${w}" data-v="0">Out</button>`;
    for(let t=Math.max(1,from);t<=4;t++){
      const l=t===4?'Casa':(t===from?`${t}ª (fica)`:`${t}ª`);
      opts+=`<button class="chip sm${cur===t?' on':''}" data-a="${act}" data-w="${w}" data-v="${t}">${l}</button>`;
    }
    rows.push(`<div class="mv-row"><div class="who2">${label} <span>· ${esc(N(key))}</span></div><div class="chips">${opts}</div></div>`);
  }
  return rows.join('');
}
function checkMoves(mv,S,withBatter){
  const who=[...(withBatter?['B']:[]),...[1,2,3].filter(b=>S.bases[b-1]).map(String)];
  const lbl={B:'O rebatedor','1':'O corredor da 1ª','2':'O corredor da 2ª','3':'O corredor da 3ª'};
  const occ={};const fin=[];
  for(const w of who){
    const t=mv[w]!==undefined?mv[w]:(w==='B'?undefined:+w);
    if(t===undefined) return 'Indique para onde foi o rebatedor.';
    if(t>=1&&t<=3){if(occ[t]) return `${lbl[w]} e ${lbl[occ[t]].toLowerCase()} terminaram na mesma base (${t}ª).`;occ[t]=w;}
    fin.push({o:w==='B'?0:+w,t});
  }
  const alive=fin.filter(x=>x.t!==0).sort((a,b)=>a.o-b.o);
  for(let i=0;i<alive.length-1;i++){const a=alive[i],b=alive[i+1];if(a.t>=b.t&&!(a.t===4&&b.t===4)) return 'Um corredor não pode passar à frente do corredor que está adiante dele.';}
  const outs=fin.filter(x=>x.t===0).length;
  if(S.outs+outs>3) return `Isso daria ${S.outs+outs} outs na entrada. O máximo é 3.`;
  return null;
}

      <div class="vs-side">${crest(opT||{},f.oppAbbr||'?',52)}<label class="f">Adversário<select id="gf-oppteam">${teamOptions(f.oppTeamId,f.myTeamId,`<option value="">Outro time (digitar nomes)</option>`)}</select></label></div>
    </div>
    ${f.oppTeamId?'':`<div class="row"><label class="f">Nome do adversário<input id="gf-opp" data-f="oppName" value="${esc(f.oppName)}" placeholder="Nome do time"></label></div>`}
    <div class="row"><label class="f" style="flex:0 0 120px">Sigla no placar<input id="gf-abbr" data-f="oppAbbr" maxlength="5" value="${esc(f.oppAbbr)}" placeholder="ADV"></label><label class="f">Data<input type="date" id="gf-date" data-f="date" value="${esc(f.date)}"></label><label class="f" style="flex:0 0 100px">Entradas<select data-f="innings" id="gf-inn">${[4,5,6,7,9].map(n=>`<option${+f.innings===n?' selected':''}>${n}</option>`).join('')}</select></label></div>
    <label class="f">Local<input id="gf-place" data-f="place" value="${esc(f.place)}" placeholder="Campo / cidade"></label>
    <div><div class="lbl" style="margin-bottom:6px">Mando</div><div class="seg"><button class="${f.home?'on':''}" data-a="gf-home" data-v="1">Em casa (ataca na baixa)</button><button class="${!f.home?'on':''}" data-a="gf-home" data-v="0">Visitante (ataca na alta)</button></div></div>
  </div>`;
  h+=`<h3>Ordem de rebatedores · ${esc(myT?myT.name:'')}</h3><div class="card">`;
  if(!roster.length) h+=`<p class="small muted">Esse time não tem atletas cadastrados. Adicione em Elenco.</p>`;
  f.my.forEach((r,i)=>{h+=`<div class="lu-row"><span class="n">${i+1}</span><select id="gf-my-${i}" data-f="my.${i}.pid" aria-label="Rebatedor ${i+1}">${popt(roster,r.pid)}</select><select id="gf-mypos-${i}" data-f="my.${i}.pos" aria-label="Posição ${i+1}">${posopt(r.pos)}</select></div>`;});
  h+=`<div class="row"><button class="btn" data-a="lu-add">+ Rebatedor</button>${f.my.length>1?'<button class="btn" data-a="lu-rem">− Remover último</button>':''}</div>
    <label class="f" style="margin-top:10px">Arremessador titular<select id="gf-myp" data-f="myP">${popt(roster,f.myP)}</select></label></div>`;
  if(f.oppTeamId){
    const or=teamPlayers(f.oppTeamId);
    h+=`<h3>Ordem de rebatedores · ${esc(opT.name)}</h3><div class="card"><p class="small muted" style="margin-top:0">Pré-preenchida em ordem alfabética. Ajuste quando souber a escalação deles.</p>`;
    f.opp.forEach((r,i)=>{h+=`<div class="lu-row" style="grid-template-columns:26px minmax(0,1fr)"><span class="n">${i+1}</span><select id="gf-or-${i}" data-f="opp.${i}.pid" aria-label="Rebatedor adversário ${i+1}">${popt(or,r.pid)}</select></div>`;});
    h+=`<div class="row"><button class="btn" data-a="olu-add">+ Rebatedor</button>${f.opp.length>1?'<button class="btn" data-a="olu-rem">− Remover último</button>':''}</div>
      <label class="f" style="margin-top:10px">Arremessador titular adversário<select id="gf-orp" data-f="oppP">${popt(or,f.oppP)}</select></label></div>`;
  } else {
    h+=`<h3>Adversário · número e nome (opcionais)</h3><div class="card">`;
    f.opp.forEach((r,i)=>{h+=`<div class="lu-row opp"><span class="n">${i+1}</span><input id="gf-on-${i}" data-f="opp.${i}.num" value="${esc(r.num)}" placeholder="Nº" inputmode="numeric" aria-label="Número do rebatedor ${i+1}"><input id="gf-onm-${i}" data-f="opp.${i}.name" value="${esc(r.name)}" placeholder="Rebatedor ${i+1}" aria-label="Nome do rebatedor ${i+1}"></div>`;});
    h+=`<div class="row"><button class="btn" data-a="olu-add">+ Rebatedor</button>${f.opp.length>1?'<button class="btn" data-a="olu-rem">− Remover último</button>':''}</div>
      <div class="row" style="margin-top:10px"><label class="f" style="flex:0 0 80px">Nº arr.<input id="gf-opn" data-f="oppPn" value="${esc(f.oppPn)}" inputmode="numeric"></label><label class="f">Arremessador adversário<input id="gf-opname" data-f="oppPname" value="${esc(f.oppPname)}" placeholder="Arremessador"></label></div></div>`;
  }
  h+=`<div class="sheet-err" id="gf-err" hidden></div><div class="row" style="margin-top:14px"><button class="btn primary" data-a="gf-save" style="flex:1">Começar jogo</button></div>`;
  return h;
}

function vRoster(){
  if(!teamById(UI.rosterTeam)) UI.rosterTeam=DB.myTeamId||((DB.teams||[])[0]||{}).id;
  const t=teamById(UI.rosterTeam);
  let h=`<div class="row between"><h2 style="margin:0">Elenco</h2><button class="btn primary" data-a="pl-new">+ Atleta</button></div>`;
  h+=`<label class="f" style="margin-top:12px">Time<select id="ro-team">${teamOptions(UI.rosterTeam,null)}</select></label>`;
  h+=`<button class="btn ghost" data-a="team-new" style="margin-top:6px">+ Cadastrar outro time</button>`;
  if(!t) return h;
  const act=teamPlayers(t.id).sort((a,b)=>((+a.num||999)-(+b.num||999))||a.name.localeCompare(b.name,'pt-BR'));
  const arch=DB.players.filter(p=>p.teamId===t.id&&p.archived);
  h+=`<div class="card" style="margin-top:10px"><div class="team-head">${crest(t,t.abbr,64)}<div class="stack" style="gap:8px;flex:1;min-width:0">
      <div class="row"><label class="f">Nome do time<input id="tm-name" value="${esc(t.name)}"></label><label class="f" style="flex:0 0 100px">Sigla<input id="tm-abbr" maxlength="5" value="${esc(t.abbr)}"></label></div>
      <div class="row"><button class="btn" data-a="team-save">Salvar</button>${t.id===DB.myTeamId?'<span class="pill live">Meu time</span>':'<button class="btn" data-a="set-my">Definir como meu time</button>'}</div>
    </div></div></div>`;
  h+=`<h3>${plural(act.length,'atleta ativo','atletas ativos')}</h3>`;
  if(t.logo) h+=`<p class="small muted" style="margin-top:-2px">Atletas e escudo importados do Painel Beisebol Infantil 2026 (estatísticas WBSC Brasil). O painel não traz número de camisa nem posição: toque no atleta para completar.</p>`;
  if(!act.length) h+='<p class="muted">Nenhum atleta neste time ainda.</p>';
  h+='<div class="stack">'+act.map(p=>`<button class="list-btn" data-a="pl-edit" data-id="${p.id}"><div><div class="t">${p.num?'#'+esc(p.num)+' ':''}${esc(p.name)}</div><div class="s">${esc(p.pos||'posição —')}${p.bats?' · rebate '+({D:'destro',E:'canhoto',A:'ambidestro'})[p.bats]:''}${p.thr?' · arremessa '+({D:'destro',E:'canhoto'})[p.thr]:''}${p.full?` · <span title="Nome oficial">${esc(p.full)}</span>`:''}</div></div><span class="muted">›</span></button>`).join('')+'</div>';
  if(arch.length) h+=`<h3>Arquivados</h3><div class="stack">`+arch.map(p=>`<button class="list-btn" data-a="pl-edit" data-id="${p.id}"><div><div class="t muted">${p.num?'#'+esc(p.num)+' ':''}${esc(p.name)}</div></div><span class="muted">›</span></button>`).join('')+'</div>';
  return h;
}
function playerSheet(id){
  const p=id?DB.players.find(x=>x.id===id):{name:'',num:'',pos:'',bats:'',thr:'',teamId:UI.rosterTeam};
  const k='m:'+id;
  const used=id&&DB.games.some(g=>g.my.pitcher===id||(g.my.lineup||[]).some(l=>l.pid===id)||(g.opp&&((g.opp.keys||[]).includes(k)||g.opp.pKey===k))||(g.events||[]).some(e=>e.t==='sub'&&e.key===k));
  const b=`<div class="stack">
    <div class="row"><label class="f" style="flex:0 0 90px">Número<input id="p-num" inputmode="numeric" value="${esc(p.num)}"></label><label class="f">Nome no app<input id="p-name" value="${esc(p.name)}" placeholder="Nome e sobrenome"></label></div>
    ${p.full?`<p class="small muted" style="margin:0">Nome oficial (WBSC): ${esc(p.full)}</p>`:''}
    <label class="f">Time<select id="p-team">${teamOptions(p.teamId,null)}</select></label>
    <label class="f">Posição principal<select id="p-pos">${['',...POS_LIST,'OF','IF'].map(x=>`<option value="${x}"${x===p.pos?' selected':''}>${x||'—'}</option>`).join('')}</select></label>
    <div class="row"><label class="f">Rebate<select id="p-bats">${[['','—'],['D','Destro'],['E','Canhoto'],['A','Ambidestro']].map(([v,l])=>`<option value="${v}"${v===(p.bats||'')?' selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f">Arremessa<select id="p-thr">${[['','—'],['D','Destro'],['E','Canhoto']].map(([v,l])=>`<option value="${v}"${v===(p.thr||'')?' selected':''}>${l}</option>`).join('')}</select></label></div>
    ${id?`<p class="small muted">${used?'Este atleta aparece em jogos salvos. Para tirá-lo da lista sem perder as estatísticas, use Arquivar.':'Ainda não aparece em nenhum jogo.'}</p>`:''}
  </div>`;
  let foot=`<button class="btn" data-a="sheet-close">Cancelar</button><button class="btn primary" data-a="pl-save" data-id="${id||''}">Salvar</button>`;
  if(id) foot=(used?`<button class="btn" data-a="pl-arch" data-id="${id}">${p.archived?'Reativar':'Arquivar'}</button>`:`<button class="btn danger" data-a="pl-del" data-id="${id}">Excluir</button>`)+foot;
  return {title:id?'Editar atleta':'Novo atleta',body:b,foot};
}
function teamSheet(){
  const b=`<div class="stack"><div class="row"><label class="f">Nome do time<input id="nt-name" placeholder="Ex.: Nikkei Curitiba B"></label><label class="f" style="flex:0 0 100px">Sigla<input id="nt-abbr" maxlength="5" placeholder="NKB"></label></div>
    <label class="f">Escudo<select id="nt-logo"><option value="">Sem escudo</option>${Object.keys(LOGOS).map(c=>{const t=DB.teams.find(x=>x.logo===c);return `<option value="${c}">${c}${t?' · '+esc(t.name):''}</option>`;}).join('')}</select></label>
    <p class="small muted" style="margin:0">Use o escudo do clube para equipes A/B do mesmo clube.</p></div>`;

/* ---------- tela: números ---------- */
function statsGames(){return UI.statsFilter==='all'?DB.games:DB.games.filter(g=>g.id===UI.statsFilter);}
function vStats(){
  const games=statsGames();
  if(UI.statsFilter!=='all'&&!games.length) UI.statsFilter='all';
  const A=aggregate(statsGames());
  const fOpts=`<option value="all">Temporada · ${plural(DB.games.length,'jogo','jogos')}</option>`+DB.games.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(g=>{const S=A.states[g.id]||replay(g);return `<option value="${g.id}"${UI.statsFilter===g.id?' selected':''}>${esc(fmtDate(g.date))} vs ${esc(g.oppName)} (${S.total.my}–${S.total.opp})</option>`;}).join('');
  let h=`<h2>Números</h2><label class="f"><span>Período</span><select id="st-filter">${fOpts}</select></label>`;
  const tabs=[['bat','Rebatedores'],['pit','Arremessadores'],['sit','Situações'],['spray','Spray'],['zone','Zona']];
  h+=`<div style="overflow-x:auto;margin-top:12px"><div class="seg nowrap">${tabs.map(([k,l])=>`<button class="${UI.statsTab===k?'on':''}" data-a="st-tab" data-v="${k}">${l}</button>`).join('')}</div></div>`;
  if(!A.plays.length&&!A.pitches.length) return h+`<p class="muted" style="margin-top:14px">Sem jogadas registradas nesse período.</p>`;
  const myKey=k=>A.myBat.has(k)||A.myPit.has(k);
  const myName=UI.statsFilter==='all'?myTeam().name:gMyTeam(games[0]).name;
  if(UI.statsTab==='bat'){
    h+=`<div class="row" style="margin-top:12px"><div class="seg"><button class="${UI.statsSide==='my'?'on':''}" data-a="st-side" data-v="my">${esc(myName)}</button><button class="${UI.statsSide==='opp'?'on':''}" data-a="st-side" data-v="opp">Adversários</button></div></div>`;
    const rows=Object.values(A.bat).filter(s=>UI.statsSide==='my'?myKey(s.key):!myKey(s.key)).sort((a,b)=>b.PA-a.PA);
    const tot={PA:0,AB:0,H:0,'2B':0,'3B':0,HR:0,R:0,RBI:0,BB:0,IBB:0,HBP:0,K:0,SB:0,SF:0,TB:0};
    rows.forEach(s=>{for(const k in tot) tot[k]+=s[k];});
    const line=(nm,s,cls)=>{const r=batRates(s);return `<tr class="${cls||''}"><td>${nm}</td><td>${s.PA}</td><td>${s.AB}</td><td>${s.H}</td><td>${s['2B']}</td><td>${s['3B']}</td><td>${s.HR}</td><td>${s.R}</td><td>${s.RBI}</td><td>${s.BB+s.IBB}</td><td>${s.K}</td><td>${s.SB}</td><td>${avg(r.AVG)}</td><td>${avg(r.OBP)}</td><td>${avg(r.SLG)}</td><td>${avg(r.OPS)}</td><td>${pc(r.Kp)}</td></tr>`;};
    h+=`<div class="tbl" style="margin-top:10px"><table><thead><tr><th>Rebatedor</th><th>PA</th><th>AB</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>R</th><th>RBI</th><th>BB</th><th>K</th><th>SB</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th><th>K%</th></tr></thead><tbody>
      ${rows.map(s=>line(esc(N(s.key)),s)).join('')}${rows.length?line('Total',tot,'tot'):''}</tbody></table></div>
      <p class="foot-note">Deslize a tabela para o lado. Siglas explicadas na aba Legenda do Excel exportado.</p>`;
  }
  if(UI.statsTab==='pit'){
    const rows=Object.values(A.pit).sort((a,b)=>(myKey(a.key)===myKey(b.key)?b.OUTS-a.OUTS:(myKey(a.key)?-1:1)));
    h+=`<div class="tbl" style="margin-top:12px"><table><thead><tr><th>Arremessador</th><th>IP</th><th>Arr.</th><th>Str%</th><th>1º Str%</th><th>BF</th><th>H</th><th>R</th><th>BB</th><th>K</th><th>HR</th><th>WHIP</th><th>C/9*</th><th>Chão/Ar</th></tr></thead><tbody>
      ${rows.map(p=>{const r=pitRates(p);return `<tr><td>${esc(N(p.key))}${myKey(p.key)?'':' <span class="muted small">(adv.)</span>'}</td><td>${r.IP}</td><td>${p.NP}</td><td>${pc(r.STRp)}</td><td>${pc(r.FPSp)}</td><td>${p.BF}</td><td>${p.H}</td><td>${p.R}</td><td>${p.BB}</td><td>${p.K}</td><td>${p.HR}</td><td>${dec2(r.WHIP)}</td><td>${dec2(r.RA9)}</td><td>${p.GB}/${p.AIR}</td></tr>`;}).join('')}</tbody></table></div>
      <p class="foot-note">*C/9 usa todas as corridas permitidas. Não é ERA: o app não separa corridas limpas (sem erro) das sujas.</p>`;
  }
  if(UI.statsTab==='sit'){
    const myBat=Object.values(A.bat).filter(s=>myKey(s.key)).sort((a,b)=>b.PA-a.PA);
    h+=`<label class="f" style="margin-top:12px">Rebatedor<select id="st-sit"><option value="team">Time todo · ${esc(myName)}</option>${myBat.map(s=>`<option value="${s.key}"${UI.sitKey===s.key?' selected':''}>${esc(N(s.key))}</option>`).join('')}</select></label>`;
    const base=A.plays.filter(p=>p.t==='pa'&&p.side==='my'&&(UI.sitKey==='team'||p.batter===UI.sitKey));
    h+=`<div class="tbl" style="margin-top:10px"><table><thead><tr><th>Situação</th><th>PA</th><th>H</th><th>AVG</th><th>OBP</th><th>SLG</th><th>K%</th><th>BB%</th></tr></thead><tbody>${SPLITS.map(([nm,fn])=>{const s=splitOf(base.filter(fn));return `<tr><td>${nm}</td><td>${s.PA}</td><td>${s.H}</td><td>${avg(s.AVG)}</td><td>${avg(s.OBP)}</td><td>${avg(s.SLG)}</td><td>${pc(s.Kp)}</td><td>${pc(s.BBp)}</td></tr>`;}).join('')}</tbody></table></div>
      <p class="foot-note">A contagem considerada é a do momento do último arremesso da vez. Amostras pequenas variam muito: olhe a coluna PA antes de tirar conclusões.</p>`;
  }
  if(UI.statsTab==='spray'){
    const keys=[...new Set(A.plays.filter(p=>p.t==='pa'&&p.sp).map(p=>p.batter))];
    const opts=`<option value="team">Time todo · ${esc(myName)}</option><option value="oppteam"${UI.spray==='oppteam'?' selected':''}>Adversários</option>`+keys.filter(myKey).map(k=>`<option value="${k}"${UI.spray===k?' selected':''}>${esc(N(k))}</option>`).join('')+keys.filter(k=>!myKey(k)).map(k=>`<option value="${k}"${UI.spray===k?' selected':''}>${esc(N(k))} (adv.)</option>`).join('');
    const pts=A.plays.filter(p=>p.t==='pa'&&p.sp&&(UI.spray==='team'?p.side==='my':UI.spray==='oppteam'?p.side==='opp':p.batter===UI.spray));
    const cls=p=>(RES[p.res]||{}).hit?'hit':(['FC','E'].includes(p.res)?'reach':'out');
    h+=`<label class="f" style="margin-top:12px">Rebatedor<select id="st-spray">${opts}</select></label>`;
    h+=`<div class="card" style="margin-top:10px">${fieldSvg({points:pts.map(p=>({sp:p.sp,c:cls(p)})),labels:false})}<div class="legend" style="margin-top:6px"><span><i style="background:var(--accent)"></i>Rebatida</span><span><i style="border:2px solid var(--out);background:var(--surface)"></i>Eliminado</span><span><i style="background:var(--strike);border-radius:1px;transform:rotate(45deg)"></i>Erro / escolha</span></div></div>`;
    const n=pts.length||1;
    const dir={Esquerda:0,Centro:0,Direita:0};pts.forEach(p=>dir[dirOf(p.sp)]++);
    const ht={};pts.forEach(p=>{if(p.ht) ht[p.ht]=(ht[p.ht]||0)+1;});
    const bar=(l,v,tot)=>`<div class="bar"><span>${l}</span><span class="t"><i style="width:${Math.round(v/tot*100)}%"></i></span><span class="v">${v} · ${Math.round(v/tot*100)}%</span></div>`;
    const htTot=Object.values(ht).reduce((a,b)=>a+b,0)||1;
    h+=`<div class="grid2" style="margin-top:12px"><div class="card"><div class="lbl" style="margin-bottom:8px">Direção · ${plural(pts.length,'bola','bolas')}</div><div class="bars">${Object.entries(dir).map(([k,v])=>bar(k,v,n)).join('')}</div></div>
      <div class="card"><div class="lbl" style="margin-bottom:8px">Tipo de contato</div><div class="bars">${Object.entries(HT).map(([k,l])=>bar(l,ht[k]||0,htTot)).join('')}</div></div></div>
      <p class="foot-note">Direção vista do home: esquerda = lado do 3B e LF. Para um destro, puxar a bola é para a esquerda; para um canhoto, para a direita.</p>`;
  }
  if(UI.statsTab==='zone'){
    const pks=[...new Set(A.pitches.filter(p=>p.zx!=null).map(p=>p.pitcher))];
    if(!pks.length) return h+`<p class="muted" style="margin-top:14px">Nenhum arremesso com local marcado. Use "Detalhar arremesso" na tela de marcação.</p>`;
    if(!pks.includes(UI.zoneKey)) UI.zoneKey=pks.find(myKey)||pks[0];
    const list=A.pitches.filter(p=>p.pitcher===UI.zoneKey&&p.zx!=null);
    const grid=Array.from({length:25},()=>({n:0,s:0}));
    list.forEach(p=>{const c=grid[p.zy*5+p.zx];c.n++;if('CSFX'.includes(p.r)) c.s++;});
    const max=Math.max(1,...grid.map(c=>c.n));
    const inZ=list.filter(p=>p.zx>=1&&p.zx<=3&&p.zy>=1&&p.zy<=3).length;
    const swOut=list.filter(p=>!(p.zx>=1&&p.zx<=3&&p.zy>=1&&p.zy<=3)&&(p.r==='S'||p.r==='F'||p.r==='X')).length;
    const outZ=list.length-inZ;
    h+=`<label class="f" style="margin-top:12px">Arremessador<select id="st-zone">${pks.map(k=>`<option value="${k}"${UI.zoneKey===k?' selected':''}>${esc(N(k))}${myKey(k)?'':' (adv.)'}</option>`).join('')}</select></label>`;
    h+=`<div class="grid2" style="margin-top:10px"><div class="card"><div class="heat">${grid.map((c,i)=>{const x=i%5,y=Math.floor(i/5);const iz=x>=1&&x<=3&&y>=1&&y<=3;const pct=Math.round(c.n/max*70);return `<div class="${iz?'in':''}" style="background:color-mix(in srgb,var(--accent) ${pct}%,var(--surface));color:${pct>40?'var(--accent-ink)':'var(--ink)'}" title="${c.n} arremessos, ${c.s} strikes">${c.n||''}</div>`;}).join('')}</div><div class="zone-cap">Visão do receptor · número = arremessos no ponto</div></div>
      <div class="card"><div class="lbl" style="margin-bottom:8px">Resumo · ${plural(list.length,'arremesso marcado','arremessos marcados')}</div>
      <div class="bars">
        <div class="bar"><span>Na zona</span><span class="t"><i style="width:${Math.round(inZ/list.length*100)}%"></i></span><span class="v">${Math.round(inZ/list.length*100)}%</span></div>
        <div class="bar"><span>Fora: girou</span><span class="t"><i style="width:${outZ?Math.round(swOut/outZ*100):0}%"></i></span><span class="v">${outZ?Math.round(swOut/outZ*100):0}%</span></div>
      </div>

}

/* ---------- arquivos ---------- */
function slug(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'jogo';}
function makeFile(kind,scope){
  const games=scope==='all'?DB.games:DB.games.filter(g=>g.id===scope);
  const g=scope!=='all'?games[0]:null;
  const stamp=today();
  const base=g?`nkcscore_${g.date}_${slug(g.oppName)}`:`nkcscore_temporada_${stamp}`;
  if(kind==='xlsx') return {blob:new Blob([xlsxBytes(buildSheets(DB,games))],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name:base+'.xlsx'};
  if(kind==='csv'){const sh=buildSheets(DB,games).find(s=>s.name==='Jogadas');return {blob:new Blob([csvText(sh.rows)],{type:'text/csv;charset=utf-8'}),name:base.replace('nkcscore_','nkcscore_jogadas_')+'.csv'};}
  return {blob:new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}),name:`nkcscore_backup_${stamp}.json`};
}
function download(f){
  const a=document.createElement('a');a.href=URL.createObjectURL(f.blob);a.download=f.name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
}
async function share(f){
  try{
    const file=new File([f.blob],f.name,{type:f.blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.name});return true;}
  }catch(e){if(e&&e.name==='AbortError') return true;}
  download(f);toast('Compartilhamento indisponível aqui. O arquivo foi baixado.');return false;
}

  DB.players=DB.players.filter(p=>!p.demo||DB.games.some(g=>g.my.pitcher===p.id||(g.my.lineup||[]).some(l=>l.pid===p.id)));
  if(!gameById(DB.currentGameId)) DB.currentGameId=null;
  DB.demo=false;if(DB.team.name==='Meu Time') DB.team.name='Meu Time';
  UI.statsFilter='all';commit('Exemplo apagado');
},true);
A.wipe=()=>confirmSheet('Apagar tudo?','Todos os jogos e jogadas deste aparelho serão apagados e o elenco volta ao original do painel (números e posições que você editou também se perdem). Não dá para desfazer sem um backup.','Apagar tudo',()=>{DB=seedDB();UI.statsFilter='all';UI.detailId=null;UI.form=null;commit('Dados apagados');},true);

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el) return;
  if(el.hasAttribute('disabled')) return;
  const fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el,e);}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='d-note'&&UI.draft) UI.draft.note=t.value;
  if(t.id==='r-note'&&UI.rdraft) UI.rdraft.note=t.value;
  if(t.dataset.f&&UI.form){
    const path=t.dataset.f.split('.');let o=UI.form;
    for(let i=0;i<path.length-1;i++) o=o[path[i]];
    o[path[path.length-1]]=t.value;
    if(t.dataset.f.startsWith('my.')&&t.dataset.f.endsWith('.pid')){
      const p=DB.players.find(x=>x.id===t.value);const i=+path[1];
      if(p&&p.pos&&POS_LIST.includes(p.pos)){UI.form.my[i].pos=p.pos;const s=$('#gf-mypos-'+i);if(s) s.value=p.pos;}
    }
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='gf-myteam'&&UI.form){UI.form.myTeamId=t.value;fillMy(UI.form);render();return;}
  if(t.id==='gf-oppteam'&&UI.form){UI.form.oppTeamId=t.value;fillOpp(UI.form);render();return;}
  if(t.id==='ro-team'){UI.rosterTeam=t.value;render();return;}
  if(t.id==='st-filter'){UI.statsFilter=t.value;render();}
  if(t.id==='st-spray'){UI.spray=t.value;render();}
  if(t.id==='st-sit'){UI.sitKey=t.value;render();}
  if(t.id==='st-zone'){UI.zoneKey=t.value;render();}
  if(t.dataset.f&&UI.form&&t.tagName==='SELECT'){
    const path=t.dataset.f.split('.');let o=UI.form;for(let i=0;i<path.length-1;i++) o=o[path[i]];o[path[path.length-1]]=t.value;
  }
});
document.addEventListener('toggle',e=>{if(e.target.id==='pdet') UI.showDet=e.target.open;},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetRender) closeSheet();});
$('#imp-file').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let d;try{d=JSON.parse(rd.result);}catch(err){return toast('Arquivo inválido: não é um backup JSON.');}
    if(!d||!Array.isArray(d.games)||!Array.isArray(d.players)) return toast('Esse arquivo não é um backup do NKC Score.');
    openSheet(()=>({title:'Restaurar backup',body:`<p>O arquivo tem ${plural(d.players.length,'jogador','jogadores')} e ${plural(d.games.length,'jogo','jogos')}.</p><p class="small muted"><b>Juntar</b> adiciona o que ainda não existe aqui. <b>Substituir</b> apaga os dados deste aparelho e usa só os do arquivo.</p>`,
      foot:`<button class="btn" data-a="imp-merge">Juntar</button><button class="btn danger" data-a="imp-replace">Substituir</button>`}));
    IMPORT=d;
  };
  rd.readAsText(file);e.target.value='';
});
let IMPORT=null;
A['imp-merge']=()=>{let d=IMPORT;IMPORT=null;let np=0,ng=0;if((d.v||1)<2) d=migrateDB(Object.assign({},d));
  for(const t of d.teams||[]) if(!DB.teams.some(x=>x.id===t.id)) DB.teams.push(t);
  for(const p of d.players) if(!DB.players.some(x=>x.id===p.id)){DB.players.push(p);np++;}
  for(const g of d.games) if(!DB.games.some(x=>x.id===g.id)){DB.games.push(g);ng++;}
  closeSheet();commit(`Backup juntado: ${plural(np,'jogador','jogadores')} e ${plural(ng,'jogo','jogos')} novos`);};
A['imp-replace']=()=>{const d=IMPORT;IMPORT=null;DB=migrateDB(Object.assign({},d));closeSheet();commit('Backup restaurado');};

/* ---------- render ---------- */
function render(){
  N=makeNamer(DB);
  let h='';
  if(UI.tab==='placar') h=vLive();
  else if(UI.tab==='jogos') h=UI.form?vGameForm():(UI.detailId?vGameDetail():vGames());
  else if(UI.tab==='elenco') h=vRoster();
  else if(UI.tab==='numeros') h=vStats();
  else h=vData();
  $('#view').innerHTML=h;
  document.querySelectorAll('.tabs button').forEach(b=>{if(b.dataset.t===UI.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');});
  const g=curGame();const pill=$('#status-pill');
  if(g&&!g.final){const S=replay(g);pill.textContent=`${S.half?'▼':'▲'}${S.inning} · ${S.total.my}–${S.total.opp}`;pill.className='pill live';}
  else {pill.textContent=navigator.onLine?'Pronto offline':'Sem internet · ok';pill.className='pill';}
}
window.addEventListener('online',render);window.addEventListener('offline',render);
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&UI.wake===null){/* o navegador libera a trava ao sair; o usuário reativa */}});
render();
try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude|anthropic/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
